name: deploy

# Tout merge sur master part en production. Le workflow est rejouable à
# l'identique : `workflow_dispatch` permet de redéployer l'état courant de
# master sans nouveau commit.
#
# Secrets attendus (Settings → Secrets and variables → Actions) :
#   PDF_SSH_KEY   clé privée SSH ayant accès au VPS
#   PDF_SSH_HOST  hôte ou IP du VPS
#   PDF_SSH_USER  utilisateur SSH
#   PDF_ENV       contenu intégral du .env de production, API_KEY comprise
# Variables optionnelles :
#   PDF_SSH_PORT     port SSH (défaut : 22 — nos VPS n'écoutent pas tous dessus)
#   PDF_DEPLOY_PATH  chemin du dépôt sur le VPS (défaut : /opt/md-to-pdf)
#   PDF_PUBLIC_URL   URL publique, vérifiée après déploiement si renseignée

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-md-to-pdf
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement en production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un secret manquant doit arrêter le workflow avant qu'il ne touche au
      # VPS, pas au milieu d'un déploiement à moitié appliqué.
      - name: Vérifier les secrets
        env:
          PDF_SSH_KEY: ${{ secrets.PDF_SSH_KEY }}
          PDF_SSH_HOST: ${{ secrets.PDF_SSH_HOST }}
          PDF_SSH_USER: ${{ secrets.PDF_SSH_USER }}
          PDF_ENV: ${{ secrets.PDF_ENV }}
        run: |
          missing=""
          [ -n "$PDF_SSH_KEY" ]  || missing="$missing PDF_SSH_KEY"
          [ -n "$PDF_SSH_HOST" ] || missing="$missing PDF_SSH_HOST"
          [ -n "$PDF_SSH_USER" ] || missing="$missing PDF_SSH_USER"
          [ -n "$PDF_ENV" ]      || missing="$missing PDF_ENV"
          if [ -n "$missing" ]; then
            echo "Secrets manquants :$missing"
            exit 1
          fi
          # PDF_ENV écrase le .env du VPS : un contenu sans API_KEY couperait
          # le service au redémarrage suivant. On refuse avant d'y toucher.
          if ! printf '%s' "$PDF_ENV" | grep -qE '^API_KEY=.+'; then
            echo "PDF_ENV ne contient pas de ligne API_KEY=<valeur non vide>."
            echo "Écrire ce secret en l'état couperait la production."
            exit 1
          fi
          echo "Secrets présents et cohérents."

      - name: Préparer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PDF_SSH_KEY }}

      - name: Enregistrer la clé d'hôte
        env:
          HOST: ${{ secrets.PDF_SSH_HOST }}
          PORT: ${{ vars.PDF_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Échouer ici plutôt qu'au milieu d'un déploiement, avec de quoi corriger :
      # « Permission denied » ne dit pas si c'est la clé, l'utilisateur ou le port.
      - name: Vérifier l'accès SSH
        env:
          HOST: ${{ secrets.PDF_SSH_HOST }}
          USER: ${{ secrets.PDF_SSH_USER }}
          PORT: ${{ vars.PDF_SSH_PORT || '22' }}
        run: |
          if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
                 -p "$PORT" "$USER@$HOST" 'echo OK: $(whoami)@$(hostname)'; then
            exit 0
          fi

          echo "::error::Connexion SSH refusée sur le port $PORT."
          echo ""
          echo "La clé chargée dans l'agent est la suivante — elle doit figurer"
          echo "dans ~/.ssh/authorized_keys de l'utilisateur cible sur le VPS :"
          echo ""
          ssh-add -L || echo "(aucune clé dans l'agent : PDF_SSH_KEY est vide ou mal formée)"
          echo ""
          echo "À vérifier, dans l'ordre :"
          echo "  1. la clé publique ci-dessus est-elle autorisée pour PDF_SSH_USER sur PDF_SSH_HOST ?"
          echo "  2. PDF_SSH_USER correspond-il au compte qui l'autorise (root et debian n'ont pas le même authorized_keys) ?"
          echo "  3. le sshd écoute-t-il bien sur le port $PORT ? Définir la variable PDF_SSH_PORT sinon."
          exit 1

      # Le dépôt est cloné s'il est absent, mis à jour sinon : le même workflow
      # sert pour un VPS vierge et pour celui qui tourne déjà.
      - name: Synchroniser le dépôt sur le VPS
        env:
          HOST: ${{ secrets.PDF_SSH_HOST }}
          USER: ${{ secrets.PDF_SSH_USER }}
          PORT: ${{ vars.PDF_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.PDF_DEPLOY_PATH || '/opt/md-to-pdf' }}
          DEPLOY_REF: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_REF='$DEPLOY_REF' REPO_URL='$REPO_URL' bash -s" << 'EOF'
            set -euo pipefail

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Premier déploiement : clonage dans $DEPLOY_PATH"
              sudo mkdir -p "$DEPLOY_PATH"
              sudo chown "$(id -u):$(id -g)" "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --tags --force origin
            # --detach sur le SHA exact : l'état du VPS est celui du commit
            # déployé, sans dépendre de la branche locale. Les fichiers non
            # suivis (.env) ne sont pas touchés par un checkout.
            git checkout --detach "$DEPLOY_REF"
            echo "Dépôt synchronisé sur $DEPLOY_REF"
          EOF

      # Écrit APRÈS le checkout : le .env n'est pas suivi par git, un checkout
      # ne l'écrase pas, mais l'ordre inverse resterait fragile.
      #
      # PDF_ENV faisait un `cat >` : tout ce qui n'y figurait pas disparaissait à
      # chaque déploiement, y compris une variable posée sur le VPS la veille. Le
      # secret reste la source de vérité pour les clés qu'il porte, mais les
      # autres survivent — un déploiement ne doit rien exiger de personne.
      - name: Écrire le .env depuis PDF_ENV
        env:
          HOST: ${{ secrets.PDF_SSH_HOST }}
          USER: ${{ secrets.PDF_SSH_USER }}
          PORT: ${{ vars.PDF_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.PDF_DEPLOY_PATH || '/opt/md-to-pdf' }}
          PDF_ENV: ${{ secrets.PDF_ENV }}
          LOG420_INGEST_TOKEN: ${{ secrets.LOG420_INGEST_TOKEN }}
        run: |
          # Les valeurs vivent dans des variables d'environnement transmises par
          # ssh -o SendEnv=… plutôt que dans la ligne de commande : un secret sur
          # la ligne de commande est lisible par tout utilisateur du VPS.
          printf '%s' "$PDF_ENV" > /tmp/pdf.env
          if [ -n "$LOG420_INGEST_TOKEN" ] \
             && ! grep -qE '^LOG420_INGEST_TOKEN=.+' /tmp/pdf.env; then
            printf '\nLOG420_INGEST_TOKEN=%s\n' "$LOG420_INGEST_TOKEN" >> /tmp/pdf.env
          fi

          ssh -p "$PORT" "$USER@$HOST" "umask 077 && cat > '$DEPLOY_PATH/.env.incoming'" \
            < /tmp/pdf.env
          rm -f /tmp/pdf.env

          # La fusion vit dans deploy/merge-env.sh, déjà présent sur le VPS après
          # l'étape de synchronisation : versionné et testable, contrairement à
          # un script en ligne dans ce fichier.
          ssh -p "$PORT" "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && DEPLOY_PATH='$DEPLOY_PATH' bash deploy/merge-env.sh"

      - name: Déployer
        env:
          HOST: ${{ secrets.PDF_SSH_HOST }}
          USER: ${{ secrets.PDF_SSH_USER }}
          PORT: ${{ vars.PDF_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.PDF_DEPLOY_PATH || '/opt/md-to-pdf' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy/*.sh && ./deploy/bootstrap.sh"

      # bootstrap.sh vérifie déjà la santé et revient en arrière en cas d'échec.
      # Cette étape confirme depuis l'extérieur du VPS, à travers le proxy, ce
      # que les clients verront réellement.
      - name: Vérifier le service publiquement
        if: ${{ vars.PDF_PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PDF_PUBLIC_URL }}
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS -m 10 "$PUBLIC_URL/api/health"; then
              echo
              echo "Service joignable publiquement."
              exit 0
            fi
            sleep 5
          done
          echo "Le service ne répond pas sur $PUBLIC_URL — vérifier le reverse proxy."
          exit 1

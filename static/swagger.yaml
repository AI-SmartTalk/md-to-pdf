openapi: 3.0.3
info:
  title: md-to-pdf Document Engine API
  description: |
    Moteur de documents complet : conversion Markdown/HTML/Template vers PDF,
    thèmes, graphiques et diagrammes, aperçu PNG, fusion, filigrane, protection
    par mot de passe, caviardage, audit de mise en page et comparaison visuelle.

    ## Comportement conditionnel des réponses

    La plupart des endpoints de génération PDF acceptent les champs optionnels
    `client_id` et `pdf_name`. Selon leur présence :

    | `client_id` + `pdf_name` | Réponse |
    |--------------------------|---------|
    | **fournis** | Le PDF est sauvegardé sur le serveur et un JSON `{ "download_url": "/download/…" }` est retourné |
    | **absents** | Le fichier PDF binaire est retourné directement dans le body |

    `client_id` et `pdf_name` servent à construire un chemin sur disque : ils doivent être
    des noms simples (`[A-Za-z0-9._-]`, 128 caractères max, ne commençant pas par un point).

    ## Deux façons de désigner un PDF

    Partout où un corps de requête attend un PDF — `pdf`, `before`, `after`, les entrées de
    `pdfs` — **deux formes sont acceptées** :

    | Référence | Origine |
    |-----------|---------|
    | `/download/{client_id}/{nom}.pdf` | un PDF que ce service a produit et sauvegardé |
    | `asset://as_…` | un fichier déposé par l'appelant via `POST /api/files` |

    La première n'a pas changé et ne changera pas. La seconde est ce qui rend les outils
    utilisables sur un document que le service n'a pas fabriqué lui-même.

    ## Sortie des outils

    Les endpoints ajoutés avec l'ingestion répondent un `ToolResponse` et connaissent trois
    destinations, les mêmes partout :

    | Corps de la requête | Réponse |
    |---------------------|---------|
    | ni `client_id`/`pdf_name` ni `output` | le fichier binaire |
    | `client_id` + `pdf_name` | `{ "download_url": "…" }` |
    | `"output": "asset"` | `{ "asset": { … } }`, pour enchaîner un outil sur le précédent sans repasser par le réseau |

    ## Le verdict

    Chaque outil qui **transforme** un document rend un `verdict` : un statut, un score sur
    100 et les contrôles qui l'ont produit. Un verdict ne bloque jamais une réponse, il
    informe. Seul `/api/compose` transforme des contraintes en échec explicite.

    ## Travaux asynchrones

    Les traitements qui peuvent dépasser le budget de temps d'une requête se soumettent à
    `POST /api/jobs` et se suivent sur `GET /api/jobs/{id}`. L'URL de suivi fait foi ; le
    `callback_url` optionnel est une courtoisie envoyée une fois, jamais réessayée.

    ## Authentification

    Si la variable d'environnement `API_KEY` est définie côté serveur, tous les endpoints
    `/api/*` (sauf `/api/health`, sonde du conteneur) exigent l'en-tête `X-API-Key` ou
    `Authorization: Bearer <clé>`. Si elle n'est pas définie, l'API est ouverte.

    `API_KEY` se lit de deux façons : une valeur seule (`API_KEY=s3cr3t`) est la clé unique
    d'hier, une liste (`API_KEY=core=s3cr3t,zapier=t0k3n`) donne une clé nommée par
    intégration. Le nom part dans les journaux, dans les métriques et dans le compteur de
    quota (`API_QUOTA_PER_MINUTE`, 429 avec `Retry-After` au dépassement).

    ## Corrélation des requêtes

    Toute réponse porte un en-tête `X-Request-Id`. Envoyez le vôtre en entrée — ASCII
    imprimable, 128 caractères au plus — il est repris tel quel et attaché à chaque
    événement journalisé.

    ## Champs additifs des réponses

    Les endpoints de génération ajoutent `cached`, `layout` et `warnings` **uniquement
    quand ils s'appliquent** : une requête qui ne demande rien de nouveau reçoit
    exactement `{ "download_url": "…" }`, comme avant.
  version: 0.2.0
  contact:
    name: AI SmartTalk
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Développement local
  - url: https://pdf.aismarttalk.tech
    description: Production

security:
  - ApiKeyHeader: []
  - BearerToken: []

tags:
  - name: Files
    description: Dépôt de fichiers, référencés ensuite par `asset://`
  - name: Jobs
    description: Travaux asynchrones
  - name: Convert
    description: Conversion Markdown → PDF
  - name: Render
    description: Rendu de template Tera + données JSON → PDF
  - name: HTML
    description: Conversion HTML directe → PDF
  - name: Preview
    description: Génération de preview PNG (une page, plusieurs pages ou planche contact)
  - name: Merge
    description: Fusion de plusieurs PDFs
  - name: Watermark
    description: Ajout de watermark texte sur un PDF existant
  - name: Protect
    description: Protection par mot de passe d'un PDF
  - name: Download
    description: Téléchargement de PDFs sauvegardés
  - name: Redact
    description: Caviardage irréversible d'un PDF existant
  - name: Layout
    description: Audit de mise en page d'un PDF existant
  - name: Diff
    description: Comparaison visuelle de deux PDFs
  - name: Pages
    description: Organisation des pages d'un PDF existant
  - name: Crop
    description: Rognage des pages d'un PDF existant
  - name: Compress
    description: Compression d'un PDF, avec le verdict de ce qu'elle a coûté
  - name: Repair
    description: Réparation d'un PDF illisible
  - name: Unlock
    description: Retrait d'une protection dont l'appelant détient le mot de passe
  - name: Rasterize
    description: PDF → images PNG ou JPEG
  - name: Images
    description: Images → PDF
  - name: Office
    description: Office → PDF et PDF → Office
  - name: OCR
    description: Couche texte sur un document numérisé
  - name: Extract
    description: PDF → Markdown, texte brut ou blocs JSON
  - name: PDFA
    description: Conversion vers PDF/A
  - name: Compose
    description: Document rendu sous contraintes, avec le journal des passes
  - name: Attest
    description: Attestation signée d'un document, et sa vérification
  - name: Themes
    description: Kits de marque livrés avec le service
  - name: Health
    description: Health check du service
  - name: Metrics
    description: Exposition Prometheus
  - name: Accounts
    description: Compte, session et clés d'API en libre-service
  - name: MCP
    description: Model Context Protocol — la surface agent, authentifiée par les mêmes clés
  - name: Legacy
    description: Endpoint legacy (backward compatible)

paths:
  # ───────────────────────────────────────────────
  # Health
  # ───────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Vérifie que le service est opérationnel et retourne la version ainsi que les moteurs
        PDF réellement installés dans l'image. `status` vaut `degraded` — et la réponse est
        alors un **503** — si pandoc ou weasyprint sont absents, ou si le bac à sable de
        conversion ne répond plus (`sandbox: unreachable`). Le code HTTP porte le verdict
        parce que tout ce qui surveille cette route est un `curl -fsS` qui ne lit que la
        ligne de statut. Endpoint jamais authentifié (utilisé par le healthcheck).

        `capabilities` nomme les familles d'endpoints dont le binaire externe est présent :
        une image construite sans Ghostscript répond 200 à toutes les sondes et 500 à toute
        compression, et c'est le seul moyen de distinguer les deux déploiements.
      operationId: health
      security: []
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                version: "0.2.0"
                engines:
                  - weasyprint
                  - wkhtmltopdf
                  - pdflatex
                capabilities:
                  - compress
                  - pdfa
                  - ocr
                  - office
                  - images-to-pdf
                  - pages
        "503":
          description: |
            Service dégradé : un moteur de rendu manque, ou le worker du bac à sable ne
            répond plus. Le corps est le même document, `status` y vaut `degraded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                version: "0.2.0"
                engines:
                  - weasyprint
                capabilities: []
                sandbox: unreachable

  # ───────────────────────────────────────────────
  # Files  (ingestion)
  # ───────────────────────────────────────────────
  /api/files:
    post:
      tags: [Files]
      summary: Déposer un ou plusieurs fichiers
      description: |
        Reçoit des octets et rend une poignée opaque. Tout endpoint qui consomme un PDF
        accepte ensuite `asset://{id}` là où il acceptait un chemin `/download/…`.

        Le champ multipart `file` est **répétable** : `-F file=@a.pdf -F file=@b.pdf`
        dépose deux fichiers en une requête.

        Le type est lu **dans les octets**, jamais dans l'extension : un `.pdf` qui commence
        par `PK` est un zip, et il est stocké comme tel. Un fichier qu'aucun outil ne sait
        traiter est accepté avec le type `unknown`.

        Plafonds : `ASSET_MAX_MB` (100 Mo par défaut) et, pour un PDF, `ASSET_MAX_PAGES`
        (2 000 pages). Rétention : `ASSET_TTL_SECS`, 2 h par défaut, après quoi le fichier
        est introuvable — l'expiration est vérifiée à chaque lecture, pas seulement par le
        balayage.
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  description: Champ répétable, un par fichier déposé
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Fichiers stockés
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetMeta"
              example:
                files:
                  - id: "as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
                    name: "contrat.pdf"
                    kind: pdf
                    bytes: 184203
                    pages: 12
                    created_at: "2026-08-19T12:02:11Z"
                    expires_at: "2026-08-19T14:02:11Z"
                    expires_unix: 1787148131
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/files/{id}:
    get:
      tags: [Files]
      summary: Récupérer un fichier déposé
      description: Rend les octets stockés, avec le `Content-Type` du type détecté.
      operationId: fetchFile
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Le fichier
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Files]
      summary: Oublier un fichier avant son expiration
      description: |
        Supprime le fichier et ses métadonnées immédiatement. Répond 204 sans corps : il ne
        reste rien à décrire.
      operationId: deleteFile
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "204":
          description: Fichier supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/files/{id}/meta:
    get:
      tags: [Files]
      summary: Métadonnées d'un fichier déposé
      description: Ce que la réponse au dépôt disait, relu depuis le magasin.
      operationId: fileMeta
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Métadonnées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # Jobs  (travaux asynchrones)
  # ───────────────────────────────────────────────
  /api/jobs:
    post:
      tags: [Jobs]
      summary: Soumettre un travail asynchrone
      description: |
        Prend le nom d'un endpoint et le corps que cet endpoint aurait reçu, et rend
        immédiatement une poignée. Le travail passe par la même file et le même budget de
        temps qu'un rendu synchrone : c'est une couche d'état, pas un second chemin
        d'exécution.

        Endpoints acceptés : `compress`, `ocr`, `pdfa`, `office-to-pdf`, `pdf-to-office`,
        `pages`, `rasterize`, `repair`, `images-to-pdf`. Les opérations courtes restent
        synchrones. `/api/ocr`, `api/ocr` et `ocr` désignent la même chose.

        La destination du résultat est forcée à `asset` quand le corps ne nomme pas
        `client_id` + `pdf_name` : un travail asynchrone n'a pas de socket où écrire un
        fichier, et un `done` sans rien à récupérer ne servirait personne.

        `callback_url` est vérifiée par le garde anti-SSRF avant que le travail n'existe.
        Le POST est envoyé **une fois**, signé par `X-Signature`, jamais réessayé : l'URL de
        suivi reste la source de vérité.
      operationId: submitJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
            example:
              endpoint: "/api/ocr"
              body:
                pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
                languages: [fra, eng]
              callback_url: "https://exemple.tld/hooks/pdf"
      responses:
        "202":
          description: Travail accepté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobView"
              example:
                job_id: "job_3d1f8a7c0b25e4964f18ad3c07be92d1"
                status: queued
                kind: ocr
                created_at: "2026-08-19T12:02:11Z"
                updated_at: "2026-08-19T12:02:11Z"
                poll_url: "/api/jobs/job_3d1f8a7c0b25e4964f18ad3c07be92d1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: État d'un travail
      description: |
        `queued`, `running`, `done` ou `failed`. Le résultat d'un travail terminé est le
        `ToolResponse` que l'endpoint synchrone aurait rendu.

        Le registre est en mémoire et le dossier est oublié au bout de `JOB_TTL_SECS`
        (1 h par défaut) : passé ce délai, la réponse est 404.
      operationId: jobStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "job_3d1f8a7c0b25e4964f18ad3c07be92d1"
      responses:
        "200":
          description: État du travail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────────────────────────
  # Convert  (Markdown → PDF)
  # ───────────────────────────────────────────────
  /api/convert:
    post:
      tags: [Convert]
      summary: Markdown → PDF
      description: |
        Convertit du Markdown en PDF via pandoc + moteur PDF (weasyprint par défaut).

        Tags CENSOR ponctuels (`{{CENSOR}}`, `<CENSOR>`) et régions
        (`{{CENSOR:start}}` … `{{CENSOR:end}}`, `{{CENSOR:teaser=25}}`, `{{CENSOR:inline}}`) :
        le texte censuré est retiré avant pandoc, il n'atteint jamais le PDF.

        Les blocs ```chart et ```mermaid deviennent du SVG inline. Un bloc qui ne peut pas
        être rendu reste un bloc de code et la raison revient dans `warnings` — jamais une
        erreur de requête.

        `header_html` est prioritaire sur `header_template` (inline > fichier serveur).
      operationId: convert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertRequest"
            example:
              markdown: "# Mon Document\n\n```chart\n{\"type\": \"bar\", \"labels\": [\"Q1\", \"Q2\"], \"series\": [{\"name\": \"2026\", \"data\": [12000, 18000]}]}\n```\n\n```mermaid\ngraph TD; A[Requête] --> B[PDF];\n```\n\n{{CENSOR:start,premium}}\nRéservé aux abonnés.\n{{CENSOR:end}}\n"
              css: "h1 { color: navy; }"
              engine: weasyprint
              options:
                paper_size: a4
                orientation: portrait
                page_numbers: true
                theme: report
              header_template: "header.html"
              client_id: "client-123"
              pdf_name: "rapport-2024"
      responses:
        "200":
          description: PDF généré avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
              example:
                download_url: "/download/client-123/rapport-2024.pdf"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Render  (Template Tera + JSON → PDF)
  # ───────────────────────────────────────────────
  /api/render:
    post:
      tags: [Render]
      summary: Template Tera + données JSON → PDF
      description: |
        Rend un template HTML (syntaxe Tera / Jinja2) avec des données JSON,
        puis convertit le HTML résultant en PDF via weasyprint (sans pandoc).

        Le champ `data` **doit** être un objet JSON (pas un tableau, string, etc.).
      operationId: render
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
            example:
              template: "<html><body><h1>{{ title }}</h1><p>Cher {{ name }},</p><p>{{ body }}</p></body></html>"
              data:
                title: "Facture #123"
                name: "Jean Dupont"
                body: "Merci pour votre achat."
              client_id: "client-123"
              pdf_name: "facture-123"
      responses:
        "200":
          description: PDF généré avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # HTML to PDF
  # ───────────────────────────────────────────────
  /api/html-to-pdf:
    post:
      tags: [HTML]
      summary: HTML → PDF
      description: |
        Convertit du HTML brut directement en PDF via weasyprint (pas de pandoc).
        Idéal pour du HTML déjà construit côté client.
      operationId: htmlToPdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlToPdfRequest"
            example:
              html: "<html><body><h1>Hello World</h1><p>Conversion HTML directe.</p></body></html>"
              css: "body { font-family: Arial; }"
              options:
                paper_size: a4
                margins:
                  top: "1cm"
                  bottom: "1cm"
                  left: "2cm"
                  right: "2cm"
              client_id: "client-123"
              pdf_name: "page-html"
      responses:
        "200":
          description: PDF généré avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Preview  (→ PNG)
  # ───────────────────────────────────────────────
  /api/preview:
    post:
      tags: [Preview]
      summary: Génération de preview PNG
      description: |
        Génère un PDF à partir de l'un des trois modes d'entrée, puis en retourne
        une ou plusieurs pages en PNG.

        **Modes d'entrée** (mutuellement exclusifs, par ordre de priorité) :
        1. `markdown` — conversion Markdown → PDF → PNG
        2. `template` + `data` — rendu Tera → PDF → PNG
        3. `html` — HTML → PDF → PNG

        **Rétro-compatibilité** : un corps qui ne porte aucun des champs `pages`, `dpi`
        ou `layout` retourne toujours l'image PNG de la première page, comme avant.

        Sans `layout` explicite, une seule page donne un `image/png` brut et plusieurs
        pages donnent le JSON `images`.
      operationId: preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              markdown:
                summary: Preview d'un document Markdown
                value:
                  markdown: "# Aperçu\n\nTexte de test."
              html:
                summary: Preview d'un HTML
                value:
                  html: "<html><body><h1>Preview HTML</h1></body></html>"
              template:
                summary: Preview d'un template Tera
                value:
                  template: "<h1>{{ title }}</h1>"
                  data:
                    title: "Mon titre"
      responses:
        "200":
          description: |
            Image PNG (page unique ou planche contact), ou JSON `images` pour
            plusieurs pages.
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPages"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Merge
  # ───────────────────────────────────────────────
  /api/merge:
    post:
      tags: [Merge]
      summary: Fusionner plusieurs PDFs
      description: |
        Fusionne N fichiers PDF précédemment sauvegardés en un seul document.

        Chaque entrée est un chemin `/download/{client_id}/{pdf_name}` **ou** une référence
        `asset://as_…` d'un fichier déposé — les deux formes se mélangent dans la même liste.
        Minimum **2 PDFs** requis.

        Comme les autres endpoints : JSON `download_url` si `client_id` + `pdf_name` sont
        fournis, sinon le PDF fusionné est retourné directement dans le body.
      operationId: merge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
            example:
              pdfs:
                - "/download/client-123/doc1.pdf"
                - "/download/client-123/doc2.pdf"
              client_id: "client-123"
              pdf_name: "merged-doc"
      responses:
        "200":
          description: PDF fusionné (JSON si sauvegardé, binaire sinon)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
              example:
                download_url: "/download/client-123/merged-doc.pdf"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Watermark
  # ───────────────────────────────────────────────
  /api/watermark:
    post:
      tags: [Watermark]
      summary: Ajouter un watermark texte
      description: |
        Ajoute un watermark texte semi-transparent en overlay sur un PDF existant.

        Le PDF source est un chemin `/download/…` **ou** une référence `asset://as_…`.
      operationId: watermark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatermarkRequest"
            example:
              pdf: "/download/client-123/rapport.pdf"
              text: "BROUILLON"
              opacity: 0.1
              angle: -45
              client_id: "client-123"
              pdf_name: "rapport-watermarked"
      responses:
        "200":
          description: PDF avec watermark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Protect
  # ───────────────────────────────────────────────
  /api/protect:
    post:
      tags: [Protect]
      summary: Protéger un PDF par mot de passe
      description: |
        Chiffre un PDF existant avec un mot de passe (AES 256 bits via qpdf).

        Le PDF source est un chemin `/download/…` **ou** une référence `asset://as_…`.
      operationId: protect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectRequest"
            example:
              pdf: "/download/client-123/rapport.pdf"
              password: "secret123"
              client_id: "client-123"
              pdf_name: "rapport-protege"
      responses:
        "200":
          description: PDF protégé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Redact
  # ───────────────────────────────────────────────
  /api/redact:
    post:
      tags: [Redact]
      summary: Caviarder un PDF sauvegardé
      description: |
        Localise le texte à masquer, pose des rectangles noirs, puis **reconstruit chaque
        page à partir de pixels**. Le texte caviardé disparaît du fichier, et avec lui la
        couche texte, les signets, les annotations, les pièces jointes et les métadonnées
        de la source. Le résultat n'est ni sélectionnable ni cherchable, et il est plus
        lourd que l'original.

        Deux vérifications sont faites sur le fichier avant de le servir : le nombre de
        pages doit être celui de la source, et l'extraction de texte doit ne rien rendre.

        Au moins un de `patterns` ou `entities` est obligatoire.

        > Un PDF **scanné** (sans couche texte) ressort aplati avec `redactions: []` :
        > rien n'a pu être localisé, il n'y a pas d'OCR.
      operationId: redact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedactRequest"
            examples:
              entities:
                summary: Caviarder les données personnelles
                value:
                  pdf: "/download/client-123/contrat.pdf"
                  entities: [email, iban, phone]
                  client_id: "client-123"
                  pdf_name: "contrat-caviarde"
      responses:
        "200":
          description: PDF binaire, ou JSON quand `client_id` et `pdf_name` sont fournis
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/RedactResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Layout
  # ───────────────────────────────────────────────
  /api/layout:
    post:
      tags: [Layout]
      summary: Auditer la mise en page d'un PDF existant
      description: |
        Même analyse que `options.autolayout`, appliquée à un PDF déjà produit — y compris
        fabriqué ailleurs. Ne modifie rien.
      operationId: analyzeLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pdf]
              properties:
                pdf:
                  $ref: "#/components/schemas/PdfSource"
      responses:
        "200":
          description: Rapport de mise en page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Diff
  # ───────────────────────────────────────────────
  /api/diff:
    post:
      tags: [Diff]
      summary: Comparer deux PDFs pixel à pixel
      description: |
        Rastérise les deux documents et compare les pixels page par page.

        `threshold` vaut **0** par défaut : toute page qui a visiblement bougé rend le
        verdict `changed`. C'est ce qu'attend une intégration continue ; un défaut
        tolérant annoncerait `identical` sur un titre renommé.
      operationId: diff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiffRequest"
      responses:
        "200":
          description: Résultat de la comparaison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Pages  (organiser, découper, pivoter)
  # ───────────────────────────────────────────────
  /api/pages:
    post:
      tags: [Pages]
      summary: Extraire, supprimer, réordonner, pivoter ou découper des pages
      description: |
        Une route, un verbe `op`. Toutes les opérations sont une sélection de pages, et la
        sélection est stricte : une page que le document n'a pas est une erreur 400, jamais
        un PDF silencieusement plus court.

        | `op` | Champ requis | Effet |
        |------|--------------|-------|
        | `extract` | `pages` | ne garde que les pages nommées |
        | `delete` | `pages` | retire les pages nommées ; en retirer toutes est refusé |
        | `reorder` | `order` | `order` doit lister **chaque** page du document |
        | `rotate` | `angle` | quart de tour : 90, 180, 270 ou leur négatif ; `pages` vaut `all` par défaut |
        | `split` | — | découpe le document ; `pages` donne les points de coupe, sinon `every` donne le nombre de pages par fichier (1 par défaut) |

        Syntaxe de `pages` et de `order` : `1,3,5-9`, `2-`, `all`, `odd`, `even`.

        `split` répond toujours en JSON : chaque partie est un asset dans `assets`, et
        `pages` porte le nombre de pages du document découpé. Au plus 500 parties.
      operationId: organizePages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagesRequest"
            examples:
              extract:
                summary: Extraire les pages 1 et 4 à 6
                value:
                  pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
                  op: extract
                  pages: "1,4-6"
              rotate:
                summary: Pivoter les pages paires d'un quart de tour
                value:
                  pdf: "/download/client-123/rapport.pdf"
                  op: rotate
                  pages: even
                  angle: 90
              split:
                summary: Un fichier toutes les deux pages
                value:
                  pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
                  op: split
                  every: 2
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/pages/number:
    post:
      tags: [Pages]
      summary: Numéroter les pages d'un PDF existant
      description: |
        Les numéros sont dessinés sur un PDF transparent de la même géométrie et du même
        nombre de pages, que `qpdf --overlay` appose. La géométrie est lue dans la source :
        un calque construit pour de l'A4 arriverait mis à l'échelle et décentré sur une page
        letter ou paysage.

        `format` est du texte, pas du HTML : les seuls jetons connus sont `{page}` et
        `{pages}`.
      operationId: numberPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberPagesRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              format: "{page} / {pages}"
              position: bottom-right
              from_page: 2
              start: 1
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Crop
  # ───────────────────────────────────────────────
  /api/crop:
    post:
      tags: [Crop]
      summary: Rogner les pages d'un PDF
      description: |
        Réécrit la CropBox des pages visées, soit sur la boîte donnée, soit — mode `auto`,
        celui par défaut — sur la boîte englobante du texte que Poppler voit, augmentée de
        `margin`.

        Une page dont le contenu ne peut pas être mesuré **garde sa boîte** : rogner sur du
        vide rendrait un document aux pages blanches. Quand aucune page n'a pu être rognée,
        la source est renvoyée telle quelle avec un avertissement.
      operationId: crop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropRequest"
            examples:
              auto:
                summary: Rogner sur le contenu, 12 pt de marge
                value:
                  pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              explicit:
                summary: Boîte explicite, en points PostScript
                value:
                  pdf: "/download/client-123/rapport.pdf"
                  box: [40, 60, 555, 780]
                  pages: "2-5"
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Compress
  # ───────────────────────────────────────────────
  /api/compress:
    post:
      tags: [Compress]
      summary: Compresser un PDF, et dire ce que ça a coûté
      description: |
        Ghostscript en `-dSAFER`, quatre niveaux, et la facture attachée : le `verdict`
        compare le nombre de pages et le nombre de caractères extractibles avant et après.
        Un scan poussé en `screen` revient quatre fois plus léger et n'est plus cherchable ;
        c'est exactement ce que le verdict nomme.

        Une compression qui produit un fichier **plus gros** est une compression ratée : la
        source est alors renvoyée telle quelle, et le verdict le dit.
      operationId: compress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompressRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              level: ebook
              output: asset
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Repair
  # ───────────────────────────────────────────────
  /api/repair:
    post:
      tags: [Repair]
      summary: Réparer un PDF illisible
      description: |
        Deux passes, dans cet ordre. `qpdf --qdf` reconstruit les tables de références en
        gardant chaque objet tel qu'il a été écrit. Si qpdf n'y arrive pas, Ghostscript
        décode le document et en écrit un neuf — ce qui coûte la structure : annotations,
        champs de formulaire, pièces jointes. La méthode employée est dans le `verdict`, et
        la perte de structure dans `warnings`.

        Un fichier dont aucune des deux passes ne tire une seule page est refusé en 400 :
        rendre un PDF vide serait pire, l'appelant l'archiverait.
      operationId: repair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Unlock
  # ───────────────────────────────────────────────
  /api/unlock:
    post:
      tags: [Unlock]
      summary: Retirer une protection dont vous avez le mot de passe
      description: |
        `qpdf --decrypt` avec le mot de passe **fourni**, et rien d'autre. Cet endpoint ne
        cherche jamais un mot de passe : un `password` vide est refusé en 400. C'est la
        ligne entre un outil légitime et un outil de contournement, et elle est tracée
        volontairement.

        Le mot de passe passe par un fichier d'arguments : il n'apparaît jamais dans la
        liste des processus de la machine.
      operationId: unlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              password: "secret123"
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Rasterize  (PDF → PNG / JPEG)
  # ───────────────────────────────────────────────
  /api/rasterize:
    post:
      tags: [Rasterize]
      summary: PDF → images
      description: |
        `pdftoppm` sur un document que le service n'a pas rendu lui-même — l'équivalent de
        `/api/preview` pour un fichier déposé.

        Une seule page suit les trois destinations habituelles. **Plusieurs pages répondent
        toujours en JSON**, une entrée par page dans `assets` : plusieurs images ne peuvent
        pas partager une URL de téléchargement, et l'avertissement le dit quand `client_id`
        et `pdf_name` ont été ignorés.

        Le plafond de pages par appel est `PDF_PREVIEW_MAX_PAGES` (20 par défaut) ; au-delà
        la réponse est écourtée et `warnings` le signale. Un plafond de pixels borne aussi
        la combinaison d'un dpi élevé et de nombreuses pages.
      operationId: rasterize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RasterizeRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              pages: "1-4"
              dpi: 150
              format: png
      responses:
        "200":
          description: |
            L'image produite, ou le JSON `ToolResponse` quand une destination a été demandée
            ou que plusieurs pages ont été rendues.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Images → PDF
  # ───────────────────────────────────────────────
  /api/images-to-pdf:
    post:
      tags: [Images]
      summary: Images → un PDF
      description: |
        `img2pdf` embarque les données JPEG et PNG telles quelles, sans ré-encodage. L'ordre
        du tableau `images` est l'ordre des pages : c'est le contrat, et c'est la seule
        chose que l'appelant ne peut pas corriger après coup.

        Les entrées sont **exclusivement** des références `asset://` : le type est lu dans
        les octets, un fichier qui n'est pas une image est refusé en 400 quel que soit son
        nom. Au plus 200 images par appel.
      operationId: imagesToPdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagesToPdfRequest"
            example:
              images:
                - "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
                - "asset://as_1b7d5e0c9a48f236d51e7c02b8a9f4d6"
              paper_size: A4
              orientation: portrait
              fit: contain
              margin: 24
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Office → PDF
  # ───────────────────────────────────────────────
  /api/office-to-pdf:
    post:
      tags: [Office]
      summary: Word, Excel, PowerPoint, ODF → PDF
      description: |
        LibreOffice headless, dans un profil utilisateur jetable, sans macro ni réseau. Le
        document porte sa propre structure : la mise en page est celle que son auteur a
        écrite.

        `file` est une référence `asset://` — cette direction part toujours d'un fichier
        déposé. Un asset qui n'est pas un document bureautique est refusé en 400.
      operationId: officeToPdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeToPdfRequest"
            example:
              file: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              output: asset
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # PDF → Office
  # ───────────────────────────────────────────────
  /api/pdf-to-office:
    post:
      tags: [Office]
      summary: PDF → Word, Excel ou PowerPoint
      description: |
        Une **reconstruction**, pas une conversion : un PDF contient des glyphes à des
        coordonnées, pas des paragraphes, des tableaux et des styles — ceux-là sont devinés.
        Le service le dit dans `warnings` et le mesure dans le `verdict`, en re-rendant le
        document produit pour compter ce qui a survécu.

        `pages` décrit le document **lu**, puisque le fichier produit n'est pas un PDF. Un
        fichier enregistré via `client_id` + `pdf_name` porte l'extension `.pdf` imposée par
        le magasin de téléchargement : `"output":"asset"` le rend sous son vrai nom.
      operationId: pdfToOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfToOfficeRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              to: docx
              output: asset
      responses:
        "200":
          description: |
            Le document produit, ou le JSON `ToolResponse` quand une destination a été
            demandée.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # OCR
  # ───────────────────────────────────────────────
  /api/ocr:
    post:
      tags: [OCR]
      summary: Donner une couche texte à un document numérisé
      description: |
        `ocrmypdf`, et le sidecar relu page par page : une page qui est ressortie vide est
        **nommée** dans le verdict au lieu de voyager silencieusement dans un fichier qui a
        l'air correct.

        Tout ce qui suit en dépend : `/api/redact` rend `redactions: []` et `/api/extract`
        un document vide quand les pages sont des images de texte.

        Plafond de 300 pages par requête (et jamais plus que `ASSET_MAX_PAGES`) : au-delà,
        découper avec `/api/pages` puis traiter chaque partie. Vu le coût, préférer
        `POST /api/jobs`.
      operationId: ocr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              languages: [fra, eng]
              mode: auto
              pdfa: false
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Extract  (PDF → Markdown / texte / JSON)
  # ───────────────────────────────────────────────
  /api/extract:
    post:
      tags: [Extract]
      summary: PDF → Markdown, texte ou blocs JSON
      description: |
        Les titres, les listes et les tableaux sont **inférés** de la forme que rend
        `pdftotext -layout`. Chaque heuristique s'abstient quand elle n'est pas sûre : un
        paragraphe promu à tort en titre est pire qu'un titre laissé en paragraphe, parce
        que l'appelant n'a aucun moyen de savoir que la structure a été inventée.

        Réponse toujours JSON. Au plus 400 000 caractères par appel ; au-delà, `truncated`
        est vrai et `warnings` dit à quelle page reprendre avec `pages`.

        Un document sans couche texte ressort quasi vide — c'est ce que `warnings` signale,
        et c'est à ce moment que `/api/ocr` sert.
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              format: markdown
              pages: "1-10"
      responses:
        "200":
          description: Texte extrait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # PDF/A
  # ───────────────────────────────────────────────
  /api/pdfa:
    post:
      tags: [PDFA]
      summary: Convertir vers PDF/A
      description: |
        Ghostscript est un **producteur** PDF/A, pas un validateur : rien dans cette image
        ne prouve que le résultat passe veraPDF, et le verdict le dit en toutes lettres. Ce
        qui est vérifiable l'est : les pages sont toujours là, le fichier porte bien
        l'identification PDF/A demandée, et chaque ajustement rapporté par Ghostscript —
        une annotation retirée, une transparence aplatie — revient dans `warnings`.
      operationId: toPdfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfaRequest"
            example:
              pdf: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
              variant: "pdf/a-2b"
      responses:
        "200":
          $ref: "#/components/responses/ToolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Compose  (le contrat de document)
  # ───────────────────────────────────────────────
  /api/compose:
    post:
      tags: [Compose]
      summary: Rendre un document sous contraintes
      description: |
        L'appelant pose des **contraintes**, pas une demande de rendu : au plus quatre
        pages, aucun tableau coupé, un score de mise en page minimal. Le service rend,
        audite, corrige, re-rend, jusqu'à satisfaire le contrat ou épuiser ses passes — puis
        répond avec le document **et** le journal des passes.

        Entièrement déterministe : aucun LLM, aucun appel sortant.

        Exactement une source parmi `markdown`, `html` et `template`. `options.autolayout`
        est forcé : demander un contrat, c'est demander l'audit.

        Un contrat non tenu **ne fait pas échouer la requête** : le meilleur document produit
        est rendu, `verdict` vaut `unmet` et `unmet` nomme ce qui reste cassé. C'est le seul
        endroit où des contraintes deviennent un échec explicite, et c'est un échec qu'on
        lit dans le corps de la réponse.

        `max_passes` vaut 3 par défaut, 5 au plus. `"attest": true` scelle le résultat avec
        une attestation signée, dans le champ `attestation`.
      operationId: compose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
            example:
              markdown: "# Note de synthèse\n\nTexte du document.\n"
              options:
                theme: report
              constraints:
                max_pages: 4
                no_split_tables: true
                min_layout_score: 90
              client_id: "client-123"
              pdf_name: "note-synthese"
      responses:
        "200":
          description: |
            Le PDF binaire, ou le JSON `ComposeResponse` quand `client_id` + `pdf_name` ou
            `"output":"asset"` ont été demandés.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Attest / Verify  (la preuve)
  # ───────────────────────────────────────────────
  /api/attest:
    post:
      tags: [Attest]
      summary: Délivrer l'attestation d'un document
      description: |
        Un petit enregistrement signé : ce qui a été rendu, à partir de quoi, par quel
        moteur, avec quelle charte, et ce que le résultat pèse. Il revient sous deux formes,
        la ligne scellée `v1.<payload>.<signature>` — utilisable telle quelle dans un
        en-tête — et les mêmes informations lisibles dans `claims`.

        Ce que ça prouve est étroit et se dit simplement : que ce fichier est, octet pour
        octet, celui que ce déploiement a émis, et que les métadonnées qui l'accompagnent
        n'ont pas été retouchées. Ça ne dit rien de qui l'a demandé, et **ce n'est pas une
        signature légale**.

        L'attestation est autoportante : la vérifier demande le fichier et cette chaîne,
        jamais une consultation dans une base qu'il faudrait ensuite garder, sauvegarder et
        finir par laisser fuir.
      operationId: attest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestRequest"
            example:
              pdf: "/download/client-123/rapport.pdf"
              engine: weasyprint
              theme: "report@1"
              operations: [convert, redact]
      responses:
        "200":
          description: Attestation scellée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/verify:
    post:
      tags: [Attest]
      summary: Vérifier une attestation contre un document
      description: |
        Quatre verdicts, et les deux échecs sont distingués volontairement. `forged` : la
        signature ne correspond pas à la clé de ce déploiement — l'enregistrement a été
        altéré, ou il vient d'ailleurs. `altered` : la signature est bonne mais le document
        n'a plus le même hash — l'enregistrement est authentique et c'est le **fichier** qui
        a été modifié. Ce sont deux incidents différents, et un « invalide » unique cacherait
        lequel s'est produit.

        Une attestation illisible ou d'une autre version répond `unreadable`. La requête
        elle-même réussit dans les quatre cas : le verdict est dans le corps.
      operationId: verifyAttestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            example:
              pdf: "/download/client-123/rapport.pdf"
              attestation: "v1.eyJ2ZXJzaW9uIjox….a3f1…"
      responses:
        "200":
          description: Résultat de la vérification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Themes
  # ───────────────────────────────────────────────
  /api/themes:
    get:
      tags: [Themes]
      summary: Lister les thèmes disponibles
      description: |
        Les valeurs que `options.theme` accepte, avec leurs polices, leurs jetons de
        couleur et l'URL de leur aperçu.

        Un thème publié est **immuable** : la clé du cache de rendu contient `nom@version`,
        donc modifier un `theme.css` en place resservirait les PDF de l'ancienne version.
      operationId: listThemes
      responses:
        "200":
          description: Liste des thèmes
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThemeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/themes/{name}/{version}/preview.png:
    get:
      tags: [Themes]
      summary: Aperçu PNG d'un thème
      description: Première page du document d'exemple rendue avec le thème demandé.
      operationId: themePreview
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: report
        - name: version
          in: path
          required: true
          description: Numéro de version, ou `latest`
          schema:
            type: string
          example: latest
        - name: cover
          in: query
          required: false
          description: "`true` rend la page de couverture au lieu du corps"
          schema:
            type: boolean
      responses:
        "200":
          description: Image PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "504":
          $ref: "#/components/responses/Timeout"

  # ───────────────────────────────────────────────
  # Metrics
  # ───────────────────────────────────────────────
  /api/metrics:
    get:
      tags: [Metrics]
      summary: Exposition Prometheus
      description: |
        Compteurs de requêtes et histogrammes de latence. Les étiquettes se limitent au
        motif de route Rocket et au code de statut : jamais de `client_id` ni de nom de
        fichier.
      operationId: metrics
      responses:
        "200":
          description: Format d'exposition Prometheus
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────────────────────────
  # Comptes, session et clés en libre-service
  # ───────────────────────────────────────────────
  /api/auth/signup:
    post:
      tags: [Accounts]
      summary: Créer un compte
      description: |
        Crée un compte et ouvre la session dans la foulée : le cookie `mdpdf_session` part
        avec la réponse, il n'y a pas de connexion à refaire derrière.

        L'adresse est normalisée (minuscules, espaces retirés) et sert d'identifiant unique.
        Le mot de passe est haché en PBKDF2-HMAC-SHA256, et le hachage — délibérément lent —
        s'exécute sur un fil bloquant comme tout ce qui coûte cher ici.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              email: "jean@exemple.fr"
              password: "un mot de passe assez long"
              name: "Jean Dupont"
      responses:
        "201":
          description: Compte créé, session ouverte
          headers:
            Set-Cookie:
              schema:
                type: string
              example: "mdpdf_session=…; HttpOnly; SameSite=Lax; Path=/"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: |
            Adresse invraisemblable, mot de passe trop court, ou compte déjà existant pour
            cette adresse. Deux inscriptions simultanées sur la même adresse ne peuvent pas
            gagner toutes les deux : la seconde reçoit ce 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Accounts]
      summary: Ouvrir une session
      description: |
        Vérifie l'adresse et le mot de passe, puis pose le cookie de session. Le champ
        `name` du corps est ignoré ici.

        Un refus ne dit jamais laquelle des deux valeurs est fausse : « Wrong e-mail address
        or password » couvre les deux cas, sinon l'endpoint devient un annuaire d'adresses
        inscrites.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              email: "jean@exemple.fr"
              password: "un mot de passe assez long"
      responses:
        "200":
          description: Session ouverte
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Adresse ou mot de passe incorrects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Accounts]
      summary: Fermer la session
      description: |
        Invalide la session côté serveur et retire le cookie. Répond `204` même sans cookie :
        se déconnecter deux fois n'est pas une erreur.
      operationId: logout
      security: []
      responses:
        "204":
          description: Session fermée

  /api/auth/me:
    get:
      tags: [Accounts]
      summary: Le compte de la session en cours
      operationId: currentAccount
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Le compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Aucune session — se connecter d'abord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/history:
    get:
      tags: [Accounts]
      summary: Le registre de qualité du compte
      description: |
        Ce que ce compte a fait, du plus récent au plus ancien, **avec le verdict de chaque
        opération**. C'est la différence entre un historique de fichiers — ce que proposent
        les autres services — et un registre : « ce contrat, compressé le 12 mars, texte
        intact, 96/100 ».

        Écrit automatiquement dès qu'une opération est authentifiée par une clé du compte.
        Un visiteur anonyme ne laisse aucune trace : c'est la contrepartie du palier gratuit
        sans compte, et ce n'est pas négociable.

        Cinq cents entrées sont conservées par compte ; au-delà, les plus anciennes tombent.
      operationId: accountHistory
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Les opérations, la plus récente d'abord
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Accounts]
      summary: Effacer le registre
      description: |
        Vide l'historique sans toucher au compte. « Effacer mon historique » est une demande
        qu'on fait sans vouloir partir : elle mérite son propre bouton.
      operationId: clearAccountHistory
      security:
        - SessionCookie: []
      responses:
        "204":
          description: Registre vidé
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/keys:
    post:
      tags: [Accounts]
      summary: Créer une clé d'API
      description: |
        Crée une clé nommée pour le compte connecté. **Le secret ne circule qu'ici** : seul
        son hachage est conservé, exactement comme un mot de passe, donc il ne pourra jamais
        être réaffiché. La réponse le dit, et ce n'est pas une politesse : c'est le contrat.

        Vingt clés par compte au plus ; au-delà, il faut en révoquer une.
      operationId: createApiKey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: À quoi sert cette clé, pour la reconnaître dans la liste
                  example: "zapier"
      responses:
        "201":
          description: Clé créée — le secret est dans cette réponse et nulle part ailleurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewKeyResponse"
        "400":
          description: Nom invalide, ou vingtième clé déjà atteinte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Accounts]
      summary: Lister ses clés d'API
      description: |
        Les clés du compte connecté : identifiant, nom, date de création, dernière
        utilisation et les premiers caractères du secret — assez pour distinguer deux clés,
        pas assez pour s'en servir.
      operationId: listApiKeys
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Les clés du compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeyRecord"
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/keys/{id}:
    delete:
      tags: [Accounts]
      summary: Révoquer une clé d'API
      description: |
        Révocation immédiate et définitive. Une clé d'un autre compte est un `404`, pas un
        `403` : l'existence d'une clé qui n'est pas la vôtre ne vous regarde pas.
      operationId: revokeApiKey
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: "`key_` suivi de 32 caractères hexadécimaux"
          schema:
            type: string
          example: "key_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
      responses:
        "204":
          description: Clé révoquée
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clé inconnue pour ce compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/usage:
    get:
      tags: [Accounts]
      summary: Palier et limites du compte
      description: |
        Le palier du compte, son nombre de clés, et ce que le palier autorise — pour qu'un
        `429` ne soit jamais la première fois qu'on entend parler d'une limite.
      operationId: accountUsage
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Palier et limites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/history:
    get:
      tags: [Accounts]
      summary: Le registre de qualité du compte
      description: |
        Ce que ce compte a fait, du plus récent au plus ancien, **avec le verdict de chaque
        opération**. Cinq cents entrées sont conservées par compte ; cet endpoint renvoie les
        cent plus récentes.

        C'est la différence de fond avec un historique de fichiers. Une liste de fichiers dit
        ce qui est passé ; celle-ci dit ce que chaque passage a coûté — pages conservées,
        texte préservé, score. Un verdict isolé est une jolie carte ; un registre de verdicts
        est une preuve de qualité.

        Une opération n'est enregistrée que si elle a été faite au nom d'une clé rattachée à
        un compte : un appel anonyme ne laisse rien.
      operationId: accountHistory
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Les opérations du compte, la plus récente en tête
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Accounts]
      summary: Effacer le registre
      description: |
        Supprime tout l'historique du compte, sans confirmation et sans retour. Le droit à
        l'effacement doit être un bouton, pas un e-mail.
      operationId: clearAccountHistory
      security:
        - SessionCookie: []
      responses:
        "204":
          description: Registre effacé
        "401":
          description: Aucune session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────────────────────────────────────────────
  # MCP  (la surface agent)
  # ───────────────────────────────────────────────
  /mcp:
    get:
      tags: [MCP]
      summary: Décrire le serveur MCP
      description: |
        Ce qu'est ce serveur, sous une forme exploitable par un humain qui a collé l'URL
        dans un navigateur : nom, version, révision du protocole, transport, méthodes
        JSON-RPC implémentées et catalogue des outils (nom et description).

        Endpoint ouvert, y compris quand `API_KEY` est configurée : il ne porte aucune
        donnée, et un intégrateur qui ne peut pas constater que l'endpoint existe ne peut
        pas configurer la clé qui l'ouvre.
      operationId: mcpDescribe
      security: []
      responses:
        "200":
          description: Description du serveur et de son catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  product:
                    type: string
                  version:
                    type: string
                  protocol:
                    type: string
                  protocolVersion:
                    type: string
                  transport:
                    type: string
                  authentication:
                    type: string
                  methods:
                    type: array
                    items:
                      type: string
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
              example:
                name: md-to-pdf
                product: AI SmartTalk Documents
                version: "0.2.0"
                protocol: Model Context Protocol
                protocolVersion: "2025-06-18"
                transport: "Streamable HTTP, JSON-RPC 2.0 over POST to this same URL."
                methods:
                  - initialize
                  - notifications/initialized
                  - ping
                  - tools/list
                  - tools/call
                tools:
                  - name: document_render
                    description: "Render Markdown (or raw HTML, or a Tera template plus its data) into a PDF…"

    post:
      tags: [MCP]
      summary: Model Context Protocol (JSON-RPC 2.0)
      description: |
        Le point d'entrée unique du protocole : un agent s'y connecte, lit le catalogue et
        pilote le moteur de documents lui-même. Transport *streamable HTTP* avec une réponse
        JSON simple — ce serveur ne pousse jamais rien, donc il n'ouvre aucun flux SSE.

        Méthodes implémentées : `initialize`, `notifications/initialized`, `ping`,
        `tools/list`, `tools/call`. Un tableau de requêtes (batch) est accepté et reçoit une
        réponse par requête portant un `id`.

        Douze outils : `document_render`, `document_preview`, `document_audit`,
        `document_compose`, `document_compress`, `document_ocr`, `document_extract`,
        `document_pages`, `document_convert_office`, `document_attest`, `document_verify`,
        `themes_list`. Leurs schémas d'entrée complets se lisent avec `tools/list` — c'est
        la source de vérité, et ce document ne la recopie pas pour ne pas la contredire.

        Deux règles gouvernent les réponses :

        - **Un outil qui échoue répond `isError: true` dans son résultat, pas une erreur
          JSON-RPC.** Une erreur de protocole est invisible pour le modèle ; un résultat
          qu'il peut lire est une faute qu'il corrige à l'appel suivant. Les erreurs
          JSON-RPC sont réservées à ce que le modèle n'a pas écrit : corps illisible,
          méthode inconnue, `params` malformés.
        - **Tout fichier produit revient en `asset://`**, jamais en octets — sauf
          `document_preview`, qui renvoie des blocs image PNG, seule façon pour un agent de
          *voir* la page qu'il vient de produire.

        Authentifié par les mêmes clés que le reste de l'API, pour que la consommation d'un
        agent soit attribuée et contingentée comme n'importe quelle intégration.
      operationId: mcpCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JsonRpcRequest"
                - type: array
                  items:
                    $ref: "#/components/schemas/JsonRpcRequest"
            examples:
              list:
                summary: Lire le catalogue
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
              call:
                summary: Appeler un outil
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: document_render
                    arguments:
                      markdown: "# Rapport"
                      options:
                        theme: report
      responses:
        "200":
          description: |
            Réponse JSON-RPC, ou tableau de réponses pour un batch. Un outil qui a échoué
            répond 200 avec `result.isError` à `true`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/JsonRpcResponse"
              example:
                jsonrpc: "2.0"
                id: 2
                result:
                  isError: false
                  content:
                    - type: text
                      text: "{\n  \"asset\": { \"id\": \"as_9f2c…\" },\n  \"pages\": 4\n}"
        "202":
          description: |
            Le corps ne contenait que des notifications : rien à renvoyer. C'est ce que la
            spécification demande, et un client qui reçoit un corps pour une notification
            considère l'échange comme désynchronisé.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ───────────────────────────────────────────────
  # Download
  # ───────────────────────────────────────────────
  /download/{client_id}/{pdf_name}:
    get:
      tags: [Download]
      summary: Télécharger un PDF sauvegardé
      description: |
        Télécharge un fichier PDF précédemment sauvegardé sur le serveur.
        Le header `Content-Disposition` force le téléchargement.
      operationId: downloadPdf
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Identifiant du client
          example: "client-123"
        - name: pdf_name
          in: path
          required: true
          schema:
            type: string
          description: Nom du fichier PDF
          example: "rapport-2024.pdf"
      responses:
        "200":
          description: Fichier PDF
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="rapport-2024.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Fichier non trouvé

  # ───────────────────────────────────────────────
  # Legacy  (POST / FormData)
  # ───────────────────────────────────────────────
  /:
    post:
      tags: [Legacy]
      summary: "[Legacy] Markdown → PDF (FormData)"
      description: |
        Endpoint original de conversion Markdown → PDF, conservé pour
        la compatibilité ascendante. Utilise `application/x-www-form-urlencoded`
        ou `multipart/form-data`.

        Endpoint ouvert, donc plus étroit : moteur `weasyprint` uniquement
        (`PDF_UNAUTHENTICATED_ENGINES`), pas d'expansion des blocs ```chart et
        ```mermaid, et une URL bloquée est signalée sans faire échouer le
        document.

        **Pour les nouvelles intégrations, préférez `/api/convert`.**
      operationId: legacyConvert
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LegacyConvertForm"
            example:
              markdown: "# Hello World"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LegacyConvertForm"
      responses:
        "200":
          description: PDF généré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Erreur pandoc
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Erreur interne

# ═══════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════
components:

  # ─── Security ─────────────────────────────────
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Clé d'API, active uniquement si `API_KEY` est définie côté serveur.
    BearerToken:
      type: http
      scheme: bearer
      description: |
        Même clé que `X-API-Key`, transmise via `Authorization: Bearer <clé>`.
    SessionCookie:
      type: apiKey
      in: cookie
      name: mdpdf_session
      description: |
        Cookie de session posé par `POST /api/auth/signup` et `POST /api/auth/login`.
        `HttpOnly`, `SameSite=Lax`, et `Secure` dès que `X-Forwarded-Proto` vaut `https`.

        Il ne se mélange jamais avec `X-API-Key` : le cookie dit « un humain regarde une
        page », l'en-tête dit « un programme appelle ». C'est cette séparation qui permet au
        cookie de rester `Lax` — donc de refuser de voyager sur un POST cross-site — pendant
        que la clé reste utilisable depuis n'importe où.

  # ─── Paramètres réutilisables ─────────────────
  parameters:
    AssetId:
      name: id
      in: path
      required: true
      description: "`as_` suivi de 32 caractères hexadécimaux"
      schema:
        type: string
      example: "as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"

  # ─── Schemas ──────────────────────────────────
  schemas:

    PdfSource:
      type: string
      description: |
        Référence d'un PDF, sous **l'une des deux formes acceptées** :

        - `/download/{client_id}/{nom}.pdf` — un PDF que ce service a produit et sauvegardé ;
        - `asset://as_…` — un fichier déposé via `POST /api/files`.

        La première forme est celle d'hier, inchangée. La seconde est ce qui rend l'endpoint
        utilisable sur un document que le service n'a pas fabriqué.
      example: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"

    ToolOutput:
      type: string
      enum: [binary, asset]
      default: binary
      description: |
        Où mettre le résultat. Absent, le fichier binaire revient dans le corps.
        `asset` le garde dans le service et renvoie sa fiche, pour enchaîner un outil sur le
        précédent sans repasser par le réseau. `client_id` + `pdf_name` restent prioritaires
        pour obtenir une `download_url`.

    PdfEngine:
      type: string
      enum: [weasyprint, wkhtmltopdf, pdflatex]
      default: weasyprint
      description: Moteur PDF utilisé par pandoc

    PaperSize:
      type: string
      enum: [a4, a3, letter]
      default: a4

    Orientation:
      type: string
      enum: [portrait, landscape]
      default: portrait

    Margins:
      type: object
      description: Marges de la page (valeurs CSS, ex. "2cm", "1in", "20mm")
      properties:
        top:
          type: string
          example: "2cm"
        bottom:
          type: string
          example: "2cm"
        left:
          type: string
          example: "2cm"
        right:
          type: string
          example: "2cm"

    PdfOptions:
      type: object
      description: Options de rendu PDF communes à tous les endpoints de génération
      properties:
        paper_size:
          $ref: "#/components/schemas/PaperSize"
        orientation:
          $ref: "#/components/schemas/Orientation"
        margins:
          $ref: "#/components/schemas/Margins"
        page_numbers:
          type: boolean
          default: false
          description: Afficher les numéros de page en bas de chaque page
        page_number_format:
          type: string
          default: "counter(page)"
          description: Format CSS du numéro de page (ex. `counter(page) "/" counter(pages)`)
        toc:
          type: boolean
          default: false
          description: Générer une table des matières (pandoc uniquement)
        toc_depth:
          type: integer
          minimum: 1
          maximum: 6
          description: Profondeur de la table des matières
        watermark:
          type: string
          description: Texte de watermark léger appliqué via CSS
        theme:
          type: string
          description: |
            Kit de marque : `"nom"` pour la dernière version, `"nom@2"` pour figer.
            Voir `GET /api/themes`. Un thème publié est immuable.
          example: report
        cover:
          $ref: "#/components/schemas/Cover"
        autolayout:
          type: boolean
          default: false
          description: |
            Analyse le PDF produit et le re-rend avec du CSS correctif tant que le score
            progresse. Le rapport est renvoyé dans le champ `layout` de la réponse.
        censor_label:
          type: string
          description: |
            Libellé des blocs CENSOR qui ne nomment pas de niveau. Cascade :
            niveau du tag > `censor_label` > libellé historique.
        charts:
          type: boolean
          default: true
          description: "`false` coupe l'expansion des blocs ```chart ET ```mermaid"

    Cover:
      type: object
      description: Page de couverture insérée en tête du document
      properties:
        title:
          type: string
        subtitle:
          type: string
        logo:
          type: string
          description: URL ou chemin de l'image, soumis au contrôle anti-SSRF
        date:
          type: string

    ConvertRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          description: Contenu Markdown à convertir. Supporte les tags CENSOR.
        css:
          type: string
          description: CSS additionnel (ajouté après le CSS par défaut)
        engine:
          $ref: "#/components/schemas/PdfEngine"
        options:
          $ref: "#/components/schemas/PdfOptions"
        header_html:
          type: string
          description: HTML inline pour le header (prioritaire sur header_template)
        footer_html:
          type: string
          description: HTML inline pour le footer (prioritaire sur footer_template)
        header_template:
          type: string
          description: Nom du fichier template header (dans le dossier templates/)
        footer_template:
          type: string
          description: Nom du fichier template footer (dans le dossier templates/)
        client_id:
          type: string
          description: Identifiant client pour sauvegarder le PDF sur le serveur
        pdf_name:
          type: string
          description: Nom du fichier PDF (l'extension .pdf est ajoutée automatiquement)

    RenderRequest:
      type: object
      required: [template, data]
      properties:
        template:
          type: string
          description: Template HTML avec syntaxe Tera (Jinja2-like)
        data:
          type: object
          additionalProperties: true
          description: Données JSON injectées dans le template. **Doit être un objet.**
        css:
          type: string
          description: CSS additionnel
        options:
          $ref: "#/components/schemas/PdfOptions"
        client_id:
          type: string
        pdf_name:
          type: string

    HtmlToPdfRequest:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: Contenu HTML complet à convertir
        css:
          type: string
          description: CSS additionnel
        options:
          $ref: "#/components/schemas/PdfOptions"
        client_id:
          type: string
        pdf_name:
          type: string

    PreviewRequest:
      type: object
      description: |
        Fournir **un seul** des modes d'entrée :
        - `markdown` pour une conversion Markdown
        - `template` + `data` pour un rendu Tera
        - `html` pour du HTML direct
      properties:
        markdown:
          type: string
          description: Contenu Markdown (mode Markdown)
        html:
          type: string
          description: Contenu HTML (mode HTML)
        template:
          type: string
          description: Template Tera (mode Template, requiert `data`)
        data:
          type: object
          additionalProperties: true
          description: Données JSON pour le template (mode Template)
        css:
          type: string
        engine:
          $ref: "#/components/schemas/PdfEngine"
        options:
          $ref: "#/components/schemas/PdfOptions"
        pages:
          type: string
          description: '`"3"`, `"2-5"` ou `"all"`. Absent : la page 1 seule.'
          example: "1-4"
        dpi:
          type: integer
          minimum: 36
          maximum: 300
          default: 150
        layout:
          type: string
          enum: [png, images, sheet]
          description: |
            `png` image brute, `images` un PNG par page en JSON, `sheet` une planche
            contact en une seule image. Absent : `png` pour une page, `images` au-delà.
        header_html:
          type: string
        footer_html:
          type: string
        header_template:
          type: string
        footer_template:
          type: string

    MergeRequest:
      type: object
      required: [pdfs]
      properties:
        pdfs:
          type: array
          items:
            $ref: "#/components/schemas/PdfSource"
          minItems: 2
          description: |
            PDFs à fusionner, dans l'ordre. Chaque entrée est un chemin
            `/download/{client_id}/{nom}.pdf` **ou** une référence `asset://as_…`, et les
            deux formes peuvent se mélanger dans la même liste.
          example:
            - "/download/client-123/doc1.pdf"
            - "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
        client_id:
          type: string
        pdf_name:
          type: string

    WatermarkRequest:
      type: object
      required: [pdf, text]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        text:
          type: string
          description: Texte du watermark
        opacity:
          type: number
          format: float
          default: 0.06
          minimum: 0
          maximum: 1
          description: Opacité du watermark (0 = invisible, 1 = opaque)
        angle:
          type: number
          format: float
          default: -45
          description: Angle de rotation du watermark en degrés
        client_id:
          type: string
        pdf_name:
          type: string

    ProtectRequest:
      type: object
      required: [pdf, password]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        password:
          type: string
          description: Mot de passe pour le chiffrement AES-256
        client_id:
          type: string
        pdf_name:
          type: string

    LegacyConvertForm:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          description: Contenu Markdown
        css:
          type: string
          description: CSS additionnel
        engine:
          allOf:
            - $ref: "#/components/schemas/PdfEngine"
          description: |
            Sur cet endpoint ouvert, seul `weasyprint` est accepté : les autres
            renvoient 400 (voir `PDF_UNAUTHENTICATED_ENGINES`).
        header_template:
          type: string
          description: Nom du fichier template header
        footer_template:
          type: string
          description: Nom du fichier template footer
        client_id:
          type: string
        pdf_name:
          type: string

    RedactRequest:
      type: object
      required: [pdf]
      description: Au moins un de `patterns` ou `entities` doit être fourni.
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        patterns:
          type: array
          description: |
            Chaînes **littérales**, pas des expressions régulières. La comparaison ignore
            la casse et normalise les blancs, donc une correspondance peut franchir un
            retour à la ligne.

            Un motif qui ressemble à une regex (`\d{4}`, `[A-Z]+`, `.*`, `(?i)`) est
            refusé en 400 plutôt que traité littéralement : recevoir un document où rien
            n'a été noirci en croyant le travail fait est le scénario que ce refus évite.
          maxItems: 64
          items:
            type: string
            maxLength: 256
        entities:
          type: array
          description: |
            Chaque entité est validée par sa clé de contrôle (modulo 97 pour l'IBAN, Luhn
            pour SIRET/SIREN et cartes), ce qui empêche un numéro de facture à 14 chiffres
            d'être pris pour un SIRET.
          items:
            type: string
            enum: [email, iban, phone, siret, credit_card]
        dpi:
          type: integer
          minimum: 72
          maximum: 400
          default: 200
        client_id:
          type: string
        pdf_name:
          type: string

    RedactResponse:
      type: object
      properties:
        download_url:
          type: string
        redactions:
          type: array
          description: Zones noircies, par page. Vide sur un PDF sans couche texte.
          items:
            type: object
            properties:
              page:
                type: integer
              count:
                type: integer
        pages:
          type: integer
        mode:
          type: string
          enum: [flatten]
          description: Toujours `flatten` — aucun mode de cet endpoint ne garde de couche texte
        notice:
          type: string
          description: Le compromis accepté, rappelé dans la réponse elle-même

    DiffRequest:
      type: object
      required: [before, after]
      properties:
        before:
          allOf:
            - $ref: "#/components/schemas/PdfSource"
          description: |
            Version de référence. Chemin `/download/…` **ou** référence `asset://as_…`.
        after:
          allOf:
            - $ref: "#/components/schemas/PdfSource"
          description: |
            Version à contrôler. Chemin `/download/…` **ou** référence `asset://as_…`.
        dpi:
          type: integer
          minimum: 36
          maximum: 300
          default: 100
        threshold:
          type: number
          format: float
          default: 0
          description: Part de pixels changés tolérée. 0 ne tolère rien.
        images:
          type: boolean
          default: false
          description: Renvoie une image de surlignage par page changée

    DiffResponse:
      type: object
      properties:
        pages_total:
          type: integer
          description: Pages du plus long des deux documents
        pages_before:
          type: integer
        pages_after:
          type: integer
        pages_changed:
          type: array
          items:
            type: integer
        pages_added:
          type: array
          items:
            type: integer
        pages_removed:
          type: array
          items:
            type: integer
        changed_ratio:
          type: number
          format: float
          description: |
            Moyenne des parts de pixels changés sur tout le document. Publiée arrondie ;
            le verdict est décidé sur la valeur exacte.
        verdict:
          type: string
          enum: [identical, changed]
        threshold:
          type: number
          format: float
        dpi:
          type: integer
        per_page:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              ratio:
                type: number
                format: float
              status:
                type: string
                enum: [added, removed, geometry]
                description: Absent quand la page a simplement changé
        images:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              png:
                type: string
                description: Image de surlignage encodée en base64
              width:
                type: integer
              height:
                type: integer
        truncated:
          type: boolean

    ThemeInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: integer
        description:
          type: string
        label:
          type: string
        latest:
          type: boolean
          description: Vrai pour la version que `"nom"` sans version résout
        author:
          type: string
        fonts:
          type: array
          items:
            type: string
        colors:
          type: object
          additionalProperties:
            type: string
        cover:
          type: boolean
          description: Le thème livre une page de couverture
        header:
          type: boolean
        footer:
          type: boolean
        preview_url:
          type: string
          example: "/api/themes/report/1/preview.png"

    PreviewPages:
      type: object
      properties:
        pages:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
                description: Numéro de page 1-indexé dans le document source
              png:
                type: string
                description: Image encodée en base64
              width:
                type: integer
              height:
                type: integer
        pages_total:
          type: integer
          description: Pages du document, qui peuvent être plus nombreuses que celles rendues
        truncated:
          type: boolean
          description: Présent uniquement quand le plafond de pages a écourté la réponse

    ConvertResponse:
      type: object
      description: |
        Strictement additive : une requête qui ne demande rien de nouveau reçoit
        exactement `{ "download_url": "…" }`, comme avant.
      properties:
        download_url:
          type: string
          description: URL relative pour télécharger le PDF généré
          example: "/download/client-123/rapport-2024.pdf"
        cached:
          type: boolean
          description: Présent (et vrai) uniquement quand le PDF vient du cache de rendu
        layout:
          allOf:
            - $ref: "#/components/schemas/LayoutReport"
          description: Présent uniquement quand `options.autolayout` a été demandé
        warnings:
          type: array
          description: |
            Présent uniquement s'il y en a : un bloc `chart` ou `mermaid` qui n'a pas pu
            être rendu est laissé tel quel dans le document et la raison arrive ici.
          items:
            $ref: "#/components/schemas/BlockWarning"

    BlockWarning:
      type: object
      properties:
        kind:
          type: string
          enum: [chart, mermaid]
        message:
          type: string
        line:
          type: integer
          description: Ligne 1-indexée du bloc fautif dans le document source

    LayoutReport:
      type: object
      properties:
        pages:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 = aucun défaut détecté
        passes:
          type: integer
          description: Nombre de passes correctives appliquées (autolayout uniquement)
        issues:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [overflow, blank_page, widow_page, orphan_heading, split_table, long_table]
              page:
                type: integer
                description: Numéro de page 1-indexé
              severity:
                type: string
                enum: [error, warn, info]
              detail:
                type: string
              bbox:
                type: array
                description: x0, y0, x1, y1 en points PDF, quand le défaut est localisé
                items:
                  type: number

    # ─── Assets et travaux ──────────────────────

    AssetMeta:
      type: object
      description: |
        Ce que le service sait d'un fichier déposé. Délibérément petit : un identifiant, un
        type lu dans les octets, une taille, un nombre de pages et une expiration. Pas une
        carte de bibliothèque.
      properties:
        id:
          type: string
          description: "`as_` suivi de 32 caractères hexadécimaux"
          example: "as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
        name:
          type: string
          description: |
            Nom d'origine, nettoyé pour l'affichage seul — il ne sert jamais à construire un
            chemin.
          example: "contrat.pdf"
        kind:
          type: string
          description: |
            Type déterminé par les premiers octets. `unknown` est stocké mais aucun outil ne
            l'accepte.
          enum:
            [pdf, png, jpeg, gif, webp, tiff, docx, xlsx, pptx, odt, ods, odp,
             ole, html, markdown, text, csv, unknown]
        bytes:
          type: integer
          format: int64
        pages:
          type: integer
          description: Présent quand le type a des pages et qu'elles ont pu être comptées
        created_at:
          type: string
          example: "2026-08-19T12:02:11Z"
        expires_at:
          type: string
          example: "2026-08-19T14:02:11Z"
        expires_unix:
          type: integer
          format: int64
          description: La même échéance en secondes Unix, pour la purge

    JobRequest:
      type: object
      required: [endpoint, body]
      properties:
        endpoint:
          type: string
          description: |
            L'endpoint à exécuter : `/api/ocr`, `api/ocr` et `ocr` désignent la même chose.
          enum:
            [compress, ocr, pdfa, office-to-pdf, pdf-to-office, pages, rasterize,
             repair, images-to-pdf]
        body:
          type: object
          additionalProperties: true
          description: Le corps que cet endpoint aurait reçu
        callback_url:
          type: string
          description: |
            URL http(s) notifiée une fois le travail terminé, signée par `X-Signature`.
            Vérifiée par le garde anti-SSRF au moment de la soumission. Un seul envoi, aucun
            réessai : l'URL de suivi reste la source de vérité.

    JobView:
      type: object
      properties:
        job_id:
          type: string
          example: "job_3d1f8a7c0b25e4964f18ad3c07be92d1"
        status:
          type: string
          enum: [queued, running, done, failed]
        kind:
          type: string
          description: L'endpoint qui a produit ce travail
          example: ocr
        created_at:
          type: string
        updated_at:
          type: string
        poll_url:
          type: string
          example: "/api/jobs/job_3d1f8a7c0b25e4964f18ad3c07be92d1"
        result:
          allOf:
            - $ref: "#/components/schemas/ToolResponse"
          description: Présent uniquement quand `status` vaut `done`
        error:
          type: string
          description: Présent uniquement quand `status` vaut `failed`

    # ─── Réponse et verdict des outils ──────────

    ToolResponse:
      type: object
      description: |
        Réponse des endpoints ajoutés avec l'ingestion. Les routes qui les précèdent gardent
        `ConvertResponse`, au bit près. Chaque champ n'apparaît que quand il s'applique.
      properties:
        download_url:
          type: string
          description: Présent quand `client_id` et `pdf_name` ont été fournis
          example: "/download/client-123/rapport.pdf"
        asset:
          allOf:
            - $ref: "#/components/schemas/AssetMeta"
          description: Présent quand `"output":"asset"` a été demandé
        assets:
          type: array
          description: |
            Un outil qui produit plusieurs fichiers — `op: split`, une rastérisation de
            plusieurs pages — met une entrée par fichier ici.
          items:
            $ref: "#/components/schemas/AssetMeta"
        pages:
          type: integer
        verdict:
          $ref: "#/components/schemas/Verdict"
        warnings:
          type: array
          items:
            type: string

    Verdict:
      type: object
      description: |
        Ce que le service pense de ce qu'il vient de produire. Un verdict **ne fait jamais
        échouer une réponse** : il informe.
      properties:
        status:
          type: string
          enum: [ok, warn, fail]
          description: Le pire statut parmi les contrôles
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            100 = rien à signaler. Volontairement fruste — un avertissement coûte 10, un
            échec 35 — parce qu'un score imprévisible est un score auquel personne ne se fie.
        summary:
          type: string
          description: Une phrase sur laquelle un humain peut agir
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"

    Check:
      type: object
      properties:
        name:
          type: string
          description: "Identifiant stable : `page-count`, `text-preserved`, `ocr-confidence`…"
        status:
          type: string
          enum: [ok, warn, fail]
        detail:
          type: string
        page:
          type: integer
          description: Page 1-indexée, quand le contrôle porte sur une page en particulier

    # ─── Corps des outils ───────────────────────

    PagesRequest:
      type: object
      required: [pdf, op]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        op:
          type: string
          enum: [extract, delete, reorder, rotate, split]
        pages:
          type: string
          description: |
            Sélection de pages : `1,3,5-9`, `2-`, `all`, `odd`, `even`. Requise pour
            `extract` et `delete`, vaut `all` pour `rotate`, donne les points de coupe pour
            `split`.
          example: "1,4-6"
        order:
          type: string
          description: |
            Nouvel ordre complet, pour `reorder` : il doit lister **chaque** page du
            document.
          example: "3,1,2"
        angle:
          type: integer
          enum: [90, 180, 270, -90, -180, -270]
          description: Rotation, requise pour `rotate`
        every:
          type: integer
          minimum: 1
          default: 1
          description: |
            Pages par fichier, pour `split`. Ignoré — avec un avertissement — quand `pages`
            donne les points de coupe.
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    NumberPagesRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        format:
          type: string
          default: "{page}"
          maxLength: 64
          description: |
            Texte simple, jamais du HTML. Seuls jetons connus : `{page}` et `{pages}`.
          example: "{page} / {pages}"
        position:
          type: string
          enum: [bottom-center, bottom-left, bottom-right, top-center, top-left, top-right]
          default: bottom-center
        start:
          type: integer
          default: 1
          minimum: 0
          maximum: 1000000
          description: Numéro affiché sur la première page numérotée
        from_page:
          type: integer
          default: 1
          minimum: 1
          description: Première page qui reçoit un numéro (la première page du document est 1)
        font_size:
          type: number
          format: float
          default: 10
          minimum: 4
          maximum: 72
        margin:
          type: string
          default: "1.5cm"
          description: Distance aux bords, en `pt`, `mm`, `cm`, `in` ou `px`
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    CropRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        box:
          oneOf:
            - type: array
              description: "`[gauche, bas, droite, haut]` en points PostScript"
              minItems: 4
              maxItems: 4
              items:
                type: number
            - type: string
              enum: [auto]
          description: |
            Absent vaut `"auto"` : l'appelant qui ne connaît pas la géométrie veut qu'elle
            soit calculée. Une boîte qui dépasse la page est ramenée à la page, avec un
            avertissement.
        margin:
          type: number
          format: double
          default: 12
          maximum: 500
          description: Blanc conservé autour du contenu détecté, en mode `auto`
        pages:
          type: string
          description: "`all`, `3`, `2-5` ou `1,4,7-9`. Les pages non visées gardent leur boîte."
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    CompressRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        level:
          type: string
          enum: [screen, ebook, printer, prepress]
          default: ebook
          description: |
            Préréglage Ghostscript. Refuser une valeur inconnue est délibéré :
            `-dPDFSETTINGS` accepte n'importe quelle chaîne et ignore silencieusement celles
            qu'il ne connaît pas, donc une faute de frappe reviendrait en fichier jamais
            compressé.
        dpi:
          type: integer
          minimum: 36
          maximum: 1200
          description: |
            Résolution de rééchantillonnage des images. Absent, celle du préréglage
            s'applique.
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    RepairRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    UnlockRequest:
      type: object
      required: [pdf, password]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        password:
          type: string
          description: |
            Le mot de passe que vous détenez déjà. Un mot de passe vide est refusé : cet
            endpoint ne récupère ni ne casse jamais une protection.
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    RasterizeRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        pages:
          type: string
          description: '`"1"`, `"2-5"` ou `"all"`. Absent : tout le document, jusqu''au plafond.'
          example: "1-4"
        dpi:
          type: integer
          minimum: 36
          maximum: 300
          default: 150
        format:
          type: string
          enum: [png, jpeg]
          default: png
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    ImagesToPdfRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            Références `asset://as_…`, une par page, **dans l'ordre des pages**. Seule cette
            forme est acceptée ici.
          items:
            type: string
        paper_size:
          type: string
          enum: [A3, A4, A5, A6, Letter, Legal, Tabloid]
          default: A4
          description: Ignoré quand `fit` vaut `actual`
        orientation:
          type: string
          enum: [portrait, landscape, auto]
          default: portrait
          description: "`auto` suit l'orientation de chaque image"
        fit:
          type: string
          enum: [contain, actual]
          default: contain
          description: "`actual` donne à chaque page la taille de son image"
        margin:
          type: number
          format: double
          maximum: 144
          description: Distance entre l'image et le bord de la page, en points
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    OfficeToPdfRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          description: |
            Référence `asset://as_…` — cette direction part toujours d'un fichier déposé.
            Types acceptés : `docx`, `xlsx`, `pptx`, `odt`, `ods`, `odp`, `ole` (.doc, .xls,
            .ppt) et `csv`.
          example: "asset://as_9f2c4b1d8e6a03f75c21b40d9e8a1c37"
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    PdfToOfficeRequest:
      type: object
      required: [pdf, to]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        to:
          type: string
          enum: [docx, xlsx, pptx]
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    OcrRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        languages:
          type: array
          description: |
            Uniquement les langues installées dans l'image, dans l'ordre voulu : tesseract
            lit la première comme langue principale.
          default: [fra, eng]
          items:
            type: string
            enum: [fra, eng, deu, spa, ita]
        mode:
          type: string
          enum: [auto, force, redo]
          default: auto
          description: |
            `auto` ne traite que les pages sans texte, `force` rastérise et relit tout —
            perdant la couche texte d'origine —, `redo` remplace une couche issue d'un OCR
            précédent et garde une couche native.
        pdfa:
          type: boolean
          default: false
          description: Produire directement un PDF/A, en un seul passage
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    ExtractRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        format:
          type: string
          enum: [markdown, text, json]
          default: markdown
        pages:
          type: string
          description: '`"1"`, `"2-5"` ou `"all"`. Absent : tout le document.'
        layout:
          type: boolean
          default: true
          description: |
            Conserve la disposition en colonnes de la page. La désactiver donne l'ordre de
            lecture, au prix de tous les tableaux.

    ExtractResponse:
      type: object
      properties:
        format:
          type: string
          description: Renvoyé pour qu'un appelant qui l'a omis sache ce qu'il a reçu
          enum: [markdown, text, json]
        pages:
          type: integer
          description: Nombre de pages réellement représentées dans `content`
        content:
          description: |
            Une chaîne pour `markdown` et `text`, un tableau de pages de blocs pour `json` —
            chaque bloc portant un `type` parmi `heading`, `paragraph`, `list` et `table`.
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  page:
                    type: integer
                  blocks:
                    type: array
                    items:
                      type: object
        tables:
          type: array
          description: |
            Les tableaux reconnus par l'heuristique de colonnes, donnés bruts pour ne pas
            avoir à reparser le Markdown.
          items:
            type: object
            properties:
              page:
                type: integer
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: string
        truncated:
          type: boolean
          description: Présent quand le plafond de caractères a écourté la réponse
        warnings:
          type: array
          items:
            type: string

    PdfaRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        variant:
          type: string
          enum: ["pdf/a-1b", "pdf/a-2b", "pdf/a-3b"]
          default: "pdf/a-2b"
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    # ─── Contrat de document ────────────────────

    ComposeRequest:
      type: object
      description: Exactement une source parmi `markdown`, `html` et `template`.
      properties:
        markdown:
          type: string
        html:
          type: string
        template:
          type: string
          description: Template Tera, rendu avec `data`
        data:
          type: object
          additionalProperties: true
        css:
          type: string
          description: CSS de l'appelant, placé avant le CSS correctif des passes
        engine:
          $ref: "#/components/schemas/PdfEngine"
        options:
          allOf:
            - $ref: "#/components/schemas/PdfOptions"
          description: "`autolayout` est forcé : demander un contrat, c'est demander l'audit."
        header_html:
          type: string
        footer_html:
          type: string
        header_template:
          type: string
        footer_template:
          type: string
        constraints:
          $ref: "#/components/schemas/Constraints"
        max_passes:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: |
            Chaque passe est un rendu complet. Un contrat qui en demanderait davantage est
            un problème de document, pas de mise en page.
        attest:
          type: boolean
          default: false
          description: Sceller le résultat avec une attestation signée
        client_id:
          type: string
        pdf_name:
          type: string
        output:
          $ref: "#/components/schemas/ToolOutput"

    Constraints:
      type: object
      description: |
        Ce que l'appelant exige du document fini. Tout est optionnel, et une requête sans
        aucune contrainte est simplement un rendu accompagné de son rapport.
      properties:
        max_pages:
          type: integer
        min_pages:
          type: integer
        no_split_tables:
          type: boolean
        no_orphan_headings:
          type: boolean
        no_blank_pages:
          type: boolean
        no_overflow:
          type: boolean
        min_layout_score:
          type: integer
          minimum: 0
          maximum: 100

    Pass:
      type: object
      description: Une passe de rendu, et ce qu'elle a introduit
      properties:
        n:
          type: integer
          description: Numéro de la passe, à partir de 1
        score:
          type: integer
        pages:
          type: integer
        applied:
          type: array
          description: Les règles correctives de cette passe, en clair
          items:
            type: string

    ComposeResponse:
      type: object
      properties:
        download_url:
          type: string
          description: Présent quand `client_id` et `pdf_name` ont été fournis
        asset:
          allOf:
            - $ref: "#/components/schemas/AssetMeta"
          description: Présent quand `"output":"asset"` a été demandé
        verdict:
          type: string
          enum: [met, unmet]
          description: "`met` quand chaque contrainte tient, `unmet` sinon"
        score:
          type: integer
        pages:
          type: integer
        passes:
          type: array
          items:
            $ref: "#/components/schemas/Pass"
        unmet:
          type: array
          description: Les contraintes encore cassées, dans le vocabulaire de l'appelant
          items:
            type: string
          example:
            - "max_pages: the document is 6 pages, the contract allows 4"
        layout:
          $ref: "#/components/schemas/LayoutReport"
        attestation:
          type: string
          description: 'Présent uniquement quand `"attest": true` a été demandé'
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/BlockWarning"

    # ─── Attestation ────────────────────────────

    AttestRequest:
      type: object
      required: [pdf]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        engine:
          type: string
        theme:
          type: string
          example: "report@1"
        pdf_variant:
          type: string
          example: "pdf/a-2b"
        source_sha256:
          type: string
          description: |
            SHA-256 du document source, quand l'appelant l'a gardé. 64 caractères
            hexadécimaux, sinon 400 : la valeur est recopiée telle quelle dans un
            enregistrement signé.
          minLength: 64
          maxLength: 64
        operations:
          type: array
          description: |
            Opérations appliquées, dans l'ordre. Bornées à 16 entrées de 32 caractères
            alphanumériques, `-` et `_`.
          items:
            type: string
          example: [convert, redact]

    AttestResponse:
      type: object
      properties:
        attestation:
          type: string
          description: "La ligne scellée, sûre en en-tête : `v1.<payload>.<signature>`"
        claims:
          $ref: "#/components/schemas/Attestation"

    Attestation:
      type: object
      description: L'enregistrement signé, lisible sans le décoder
      properties:
        version:
          type: integer
          description: Version du format. Une attestation d'une autre version est `unreadable`.
          example: 1
        service:
          type: string
        issued_at:
          type: string
          example: "2026-08-19T12:02:11Z"
        output_sha256:
          type: string
          description: SHA-256 du fichier produit
        bytes:
          type: integer
          format: int64
        pages:
          type: integer
        source_sha256:
          type: string
        engine:
          type: string
        theme:
          type: string
        pdf_variant:
          type: string
        layout_score:
          type: integer
        operations:
          type: array
          items:
            type: string

    VerifyRequest:
      type: object
      required: [pdf, attestation]
      properties:
        pdf:
          $ref: "#/components/schemas/PdfSource"
        attestation:
          type: string
          description: La ligne scellée rendue par `/api/attest`

    Verification:
      type: object
      properties:
        verdict:
          type: string
          enum: [valid, altered, forged, unreadable]
          description: |
            `valid` : le document est octet pour octet celui qui a été émis.
            `altered` : l'attestation est authentique, le fichier a changé.
            `forged` : la signature ne correspond pas à la clé de ce déploiement.
            `unreadable` : l'attestation n'est pas dans une forme que ce déploiement lit.
        detail:
          type: string
          description: La phrase à montrer à un humain
        attestation:
          allOf:
            - $ref: "#/components/schemas/Attestation"
          description: Absent quand la signature n'a pas pu être vérifiée

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "0.1.0"
        engines:
          type: array
          items:
            type: string
          example: ["weasyprint", "wkhtmltopdf", "pdflatex"]
        capabilities:
          type: array
          description: |
            Familles d'endpoints dont le binaire externe est présent dans l'image. Absent
            sur un déploiement antérieur à ce champ : une sonde qui ne lit que `status` n'est
            pas concernée.
          items:
            type: string
            enum: [compress, pdfa, ocr, office, images-to-pdf, pages]
          example: ["compress", "pdfa", "ocr", "office", "images-to-pdf", "pages"]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Type d'erreur
          example: "Bad request"
        details:
          type: string
          description: Détails / message d'erreur
          example: "At least 2 PDFs are required for merging"

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Normalisée en minuscules ; c'est l'identifiant du compte.
        password:
          type: string
          format: password
          description: Dix caractères au minimum.
        name:
          type: string
          nullable: true
          description: Facultatif, et ignoré à la connexion.

    Account:
      type: object
      description: |
        Le compte tel qu'il sort de l'API. Le hachage du mot de passe n'y figure jamais, pas
        même une fois.
      properties:
        id:
          type: string
          example: "acc_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
        email:
          type: string
          example: "jean@exemple.fr"
        created_at:
          type: string
          format: date-time
        plan:
          type: string
          enum: [free, pro, team]
          description: Le palier est stocké, jamais déduit des clés que quelqu'un possède.
        name:
          type: string
          nullable: true

    SessionResponse:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/Account"

    ApiKeyRecord:
      type: object
      description: |
        Une clé, sans son secret : celui-ci n'est stocké que haché, donc une copie du magasin
        n'est pas une copie des clés.
      properties:
        id:
          type: string
          example: "key_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
        name:
          type: string
          example: "zapier"
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          description: Absent tant que la clé n'a jamais servi.
        hint:
          type: string
          description: Les onze premiers caractères du secret, pour distinguer deux clés dans une liste.
          example: "sk_9f2c1d84"

    HistoryEntry:
      type: object
      description: Une opération, et ce qu'elle a coûté.
      required: [id, tool, at]
      properties:
        id: { type: string, example: "op_9f3a…" }
        tool:
          type: string
          description: Le nom du fichier produit, qui identifie l'outil qui l'a produit
          example: "compressed.pdf"
        at: { type: string, format: date-time }
        file: { type: string, example: "contrat.pdf" }
        asset_id: { type: string, example: "as_9f3a…" }
        bytes: { type: integer, format: int64 }
        pages: { type: integer }
        verdict:
          allOf:
            - $ref: "#/components/schemas/Verdict"
          description: Le verdict rendu au moment de l'opération, conservé tel quel

    NewKeyResponse:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/ApiKeyRecord"
        secret:
          type: string
          description: Le secret en clair. Il ne repassera jamais par ici.
          example: "sk_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
        notice:
          type: string
          example: "Copy this key now: it is stored hashed and cannot be shown again."

    Usage:
      type: object
      properties:
        plan:
          type: string
          example: "free"
        keys:
          type: integer
          description: Nombre de clés actives sur le compte.
        limits:
          type: object
          properties:
            max_file_mb:
              type: integer
            retention_hours:
              type: integer
            requests_per_minute:
              type: string
              description: "`unlimited` quand `API_QUOTA_PER_MINUTE` n'est pas configurée."

    HistoryEntry:
      type: object
      description: |
        Une opération, et ce qu'elle a coûté. Les champs facultatifs sont absents quand
        l'outil n'a rien à en dire, jamais `null`.
      properties:
        id:
          type: string
          example: "op_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
        tool:
          type: string
          description: "L'outil qui a tourné : `compress`, `ocr`, `office-to-pdf`…"
          example: "compress"
        at:
          type: string
          format: date-time
        file:
          type: string
          description: Nom du fichier, tel que l'appelant l'a déposé.
        asset_id:
          type: string
          example: "as_9f2c1d84e6b74a01bd35c7f0a1e2d3c4"
        bytes:
          type: integer
        pages:
          type: integer
        verdict:
          $ref: "#/components/schemas/Verdict"

    JsonRpcRequest:
      type: object
      description: |
        Une requête JSON-RPC 2.0. Sans `id`, c'est une notification : elle ne reçoit aucune
        réponse, et un corps composé uniquement de notifications répond `202`.
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Nombre ou chaîne, repris tel quel dans la réponse. Absent = notification.
          oneOf:
            - type: integer
            - type: string
        method:
          type: string
          enum:
            - initialize
            - notifications/initialized
            - ping
            - tools/list
            - tools/call
        params:
          type: object
          description: |
            Pour `tools/call` : `{ "name": "<outil>", "arguments": { … } }`. Le schéma
            d'entrée de chaque outil est publié par `tools/list`.

    JsonRpcResponse:
      type: object
      description: |
        Une réponse JSON-RPC 2.0 : `result` ou `error`, jamais les deux. Un outil qui a
        échoué est un `result` portant `isError: true`, pas un `error`.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: |
            Repris tel quel de la requête — nombre ou chaîne. Vaut `null` quand le corps
            était illisible au point que son `id` n'a pas pu être lu.
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
              description: Code JSON-RPC standard (-32700, -32600, -32601, -32602).
            message:
              type: string

  # ─── Responses réutilisables ──────────────────
  responses:
    ToolResult:
      description: |
        Le fichier produit, ou le JSON `ToolResponse` quand `client_id` + `pdf_name` ou
        `"output":"asset"` ont été demandés.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            $ref: "#/components/schemas/ToolResponse"

    PayloadTooLarge:
      description: |
        Le corps dépasse la limite configurée. Pour `POST /api/files`, c'est `ASSET_MAX_MB`
        (100 Mo par défaut) ou la limite `file` de Rocket.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Payload too large"
            details: "The request body exceeds the configured limit"

    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Bad request"
            details: "\"data\" must be a JSON object"

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Not found"
            details: "PDF not found: /download/client-123/missing.pdf"

    Unauthorized:
      description: Clé d'API manquante ou invalide (uniquement si `API_KEY` est configurée)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Unauthorized"
            details: "Missing or invalid API key (X-API-Key or Authorization: Bearer)"

    TooManyRequests:
      description: |
        La file de rendu est pleine : la requête a attendu plus de
        `PDF_QUEUE_TIMEOUT_SECS` sans obtenir de place. Réessayer quelques secondes plus tard.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Timeout:
      description: La génération a dépassé la limite de temps (`PDF_PROCESS_TIMEOUT_SECS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Timeout"
            details: "weasyprint exceeded the 60s time limit"

    InternalError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Pandoc conversion failed"
            details: "pandoc: ... (stderr output)"

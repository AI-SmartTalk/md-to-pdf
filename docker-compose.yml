services:
  rust:
    build:
      context: .
      dockerfile: rust.dockerfile
    volumes:
      - ./:/workdir
    working_dir: /workdir
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-toolkit-network

  pandoc:
    build:
      context: .
      dockerfile: pandoc.dockerfile
    volumes:
      - ./:/workdir
    tty: true
    ports:
      # Boucle locale uniquement, comme en production : un poste de dev sur un
      # réseau partagé n'a pas à exposer le service.
      - "127.0.0.1:8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-toolkit-network

networks:
  ai-toolkit-network: 
    external: true
[package]
name = "md-to-pdf"
version = "0.2.0"
authors = ["spawnia <benedikt@franke.tech>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6"
tempfile = "3"
log = "0.4"
env_logger = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = "1"

[profile.release]
# Smaller, faster binary for the production image
lto = "thin"
codegen-units = 1
strip = true

# Reverse proxy NGINX pour md-to-pdf.
#
# À déposer dans /etc/nginx/sites-available/md-to-pdf puis lier dans
# sites-enabled. Le certificat s'obtient avec :
#   sudo certbot --nginx -d pdf.example.tech
#
# Le service n'écoute que sur 127.0.0.1:8000 : ce vhost est le seul chemin
# d'accès depuis l'extérieur.

server {
    listen 80;
    listen [::]:80;
    server_name pdf.example.tech;

    # certbot remplace ce bloc par une redirection permanente vers 443
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdf.example.tech;

    # ssl_certificate / ssl_certificate_key : renseignés par certbot

    # Un document Markdown volumineux passe en multipart : rester aligné sur les
    # limites de Rocket (10 MiB dans Rocket.toml), sinon NGINX renvoie un 413
    # avant que le service ne voie la requête.
    client_max_body_size 12m;

    # La génération d'un gros PDF peut approcher PDF_PROCESS_TIMEOUT_SECS (60s
    # par défaut). Couper à 60s côté proxy transformerait un 504 applicatif
    # propre en erreur de passerelle opaque.
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    access_log /var/log/nginx/md-to-pdf.access.log;
    error_log  /var/log/nginx/md-to-pdf.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les PDFs sont renvoyés tels quels : le tampon n'apporte rien et
        # retarde le premier octet sur les gros documents.
        proxy_buffering off;
    }

    # La sonde de santé n'a pas à polluer les logs d'accès
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }
}

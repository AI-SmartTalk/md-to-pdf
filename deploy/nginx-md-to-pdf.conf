# Reverse proxy NGINX pour md-to-pdf.
#
# À déposer dans /etc/nginx/sites-available/md-to-pdf puis lier dans
# sites-enabled. Le certificat s'obtient avec :
#   sudo certbot --nginx -d pdf.example.tech
#
# Le service n'écoute que sur 127.0.0.1:8000 : ce vhost est le seul chemin
# d'accès depuis l'extérieur.

server {
    listen 80;
    listen [::]:80;
    server_name pdf.example.tech;

    # certbot remplace ce bloc par une redirection permanente vers 443
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdf.example.tech;

    # ssl_certificate / ssl_certificate_key : renseignés par certbot

    # Deux plafonds coexistent depuis que le service accepte des dépôts :
    # POST / reste borné à 10 Mo de Markdown (Rocket.toml et src/routes/legacy.rs),
    # POST /api/files accepte ASSET_MAX_MB (100 Mo par défaut). NGINX doit laisser
    # passer le plus grand des deux, sinon il rend un 413 muet là où le service
    # aurait expliqué la limite — et la promesse « 100 Mo » du site public serait
    # fausse dès le premier visiteur.
    # Cette valeur suit ASSET_MAX_MB : les changer séparément, c'est retrouver ce
    # 413 sans explication.
    client_max_body_size 110m;
    # Un dépôt de 100 Mo ne doit pas être mis en tampon sur disque avant d'être
    # relayé : le service l'écrit déjà lui-même dans un temporaire.
    proxy_request_buffering off;

    # Le pire cas est borné par deux valeurs, pas par le nombre de processus :
    # PDF_QUEUE_TIMEOUT_SECS (30s) d'attente dans la file, puis
    # PDF_RENDER_DEADLINE_SECS (120s) pour le travail entier — passes correctives,
    # analyses du Layout Doctor, caviardage et comparaison compris. Soit 150s, et
    # jamais plus : au-delà le service rend lui-même un 504. Couper avant
    # transformerait ce 504 applicatif propre en erreur de passerelle opaque.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    access_log /var/log/nginx/md-to-pdf.access.log;
    error_log  /var/log/nginx/md-to-pdf.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les PDFs sont renvoyés tels quels : le tampon n'apporte rien et
        # retarde le premier octet sur les gros documents.
        proxy_buffering off;
    }

    # La sonde de santé n'a pas à polluer les logs d'accès
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }
}

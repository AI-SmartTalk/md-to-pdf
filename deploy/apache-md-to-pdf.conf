# Reverse proxy Apache pour md-to-pdf.
#
# pdf.aismarttalk.tech est servi par Apache : voici le vhost correspondant.
# À déposer dans /etc/apache2/sites-available/md-to-pdf.conf puis :
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite md-to-pdf && sudo systemctl reload apache2
#   sudo certbot --apache -d pdf.example.tech
#
# Le service n'écoute que sur 127.0.0.1:8000 : ce vhost est le seul chemin
# d'accès depuis l'extérieur.

<VirtualHost *:80>
    ServerName pdf.example.tech
    Redirect permanent / https://pdf.example.tech/
</VirtualHost>

<VirtualHost *:443>
    ServerName pdf.example.tech

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile : renseignés par certbot

    ProxyPreserveHost On
    ProxyRequests Off

    # Le pire cas est borné par deux valeurs, pas par le nombre de processus :
    # PDF_QUEUE_TIMEOUT_SECS (30s) d'attente dans la file, puis
    # PDF_RENDER_DEADLINE_SECS (120s) pour le rendu entier — rendus, passes
    # correctives et analyses du Layout Doctor compris, quel que soit
    # PDF_LAYOUT_MAX_PASSES. Soit 150s, et jamais plus : au-delà le service rend
    # lui-même un 504. Sous cette valeur, Apache renvoie un 503 opaque à la place.
    ProxyTimeout 180

    ProxyPass        / http://127.0.0.1:8000/ timeout=180 retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"

    # Deux plafonds coexistent depuis que le service accepte des dépôts :
    # POST / reste borné à 10 Mo de Markdown (Rocket.toml et src/routes/legacy.rs),
    # POST /api/files accepte ASSET_MAX_MB (100 Mo par défaut). Apache doit laisser
    # passer le plus grand des deux, sinon il rend un 413 muet là où le service
    # aurait expliqué la limite. Cette valeur suit ASSET_MAX_MB.
    LimitRequestBody 115343360

    ErrorLog  ${APACHE_LOG_DIR}/md-to-pdf.error.log
    CustomLog ${APACHE_LOG_DIR}/md-to-pdf.access.log combined
</VirtualHost>

# Reverse proxy Apache pour md-to-pdf.
#
# pdf.aismarttalk.tech est servi par Apache : voici le vhost correspondant.
# À déposer dans /etc/apache2/sites-available/md-to-pdf.conf puis :
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite md-to-pdf && sudo systemctl reload apache2
#   sudo certbot --apache -d pdf.example.tech
#
# Le service n'écoute que sur 127.0.0.1:8000 : ce vhost est le seul chemin
# d'accès depuis l'extérieur.

<VirtualHost *:80>
    ServerName pdf.example.tech
    Redirect permanent / https://pdf.example.tech/
</VirtualHost>

<VirtualHost *:443>
    ServerName pdf.example.tech

    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile : renseignés par certbot

    ProxyPreserveHost On
    ProxyRequests Off

    # La génération d'un gros PDF peut approcher PDF_PROCESS_TIMEOUT_SECS (60s
    # par défaut). Sous cette valeur, Apache renvoie un 503 opaque à la place du
    # 504 applicatif — c'est exactement le symptôme observé quand le service
    # met trop longtemps à répondre.
    ProxyTimeout 90

    ProxyPass        / http://127.0.0.1:8000/ timeout=90 retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"

    # Aligné sur les limites de Rocket (10 MiB dans Rocket.toml)
    LimitRequestBody 12582912

    ErrorLog  ${APACHE_LOG_DIR}/md-to-pdf.error.log
    CustomLog ${APACHE_LOG_DIR}/md-to-pdf.access.log combined
</VirtualHost>
